<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Studio — I’M AFK</title>
    <link rel="icon" type="image/png" href="icon.png">
    
    <!-- PWA / Web App Capabilities -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AFK Studio">
    <meta name="theme-color" content="#050807">
    
    <!-- Typography: Inter + Space Grotesk + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================================
           DESIGN TOKENS — MACOS LIQUID GLASS SYSTEM
           ========================================================================== */
        :root {
            --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
            --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Space Grotesk", sans-serif;
            --font-code: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;

            --radius-xs: 8px;
            --radius-sm: 12px;
            --radius-md: 18px;
            --radius-lg: 26px;
            --radius-pill: 9999px;

            --ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --ease-bounce: cubic-bezier(0.175, 0.885, 0.32, 1.55);
            --ease-snappy: cubic-bezier(0.16, 1, 0.3, 1);
            --duration-fast: 160ms;
            --duration-normal: 260ms;

            --nav-height: 54px;
            --tab-height: 40px;
            --status-height: 30px;
            --sidebar-width: 250px;
        }

        /* ---------------- Theme: Dark ---------------- */
        [data-theme="dark"] {
            --bg-canvas: #050807;
            --bg-surface: linear-gradient(145deg, rgba(255, 255, 255, 0.08) 0%, rgba(18, 30, 26, 0.72) 45%, rgba(8, 16, 13, 0.9) 100%);
            --bg-dock: linear-gradient(180deg, rgba(20, 32, 28, 0.86) 0%, rgba(10, 16, 14, 0.95) 100%);
            --bg-card: rgba(22, 34, 30, 0.75);
            --bg-input: rgba(10, 16, 14, 0.85);
            --bg-hover: rgba(255, 255, 255, 0.06);
            --bg-active: rgba(56, 225, 166, 0.16);

            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-border-strong: rgba(56, 225, 166, 0.35);
            --glass-specular: inset 1.5px 1.5px 1px 0 rgba(255, 255, 255, 0.22), inset -1px -1px 1px 1px rgba(56, 225, 166, 0.12);

            --shadow-subtle: 0 4px 14px -3px rgba(0, 0, 0, 0.5);
            --shadow-float: 0 16px 36px -8px rgba(0, 0, 0, 0.75);
            --shadow-lift: 0 24px 48px -12px rgba(0, 0, 0, 0.9), 0 0 24px rgba(56, 225, 166, 0.18);

            --text-primary: #F2F8F5;
            --text-secondary: #9DB5AC;
            --text-tertiary: #5D7970;
            --text-inverse: #050807;

            --accent-brand: #38E1A6;
            --accent-brand-hover: #5CF0BC;
            --accent-brand-soft: rgba(56, 225, 166, 0.15);
            --accent-glow: rgba(56, 225, 166, 0.28);

            --danger: #F87171;
            --warning: #FBBF24;
            --success: #34D399;

            --editor-gutter: #080D0B;
            --editor-selection: rgba(56, 225, 166, 0.25);
            --preview-bg: #FFFFFF;
        }

        /* ---------------- Theme: Light ---------------- */
        [data-theme="light"] {
            --bg-canvas: #F0F6F3;
            --bg-surface: linear-gradient(145deg, rgba(255, 255, 255, 0.92) 0%, rgba(240, 248, 244, 0.75) 50%, rgba(230, 242, 236, 0.85) 100%);
            --bg-dock: linear-gradient(180deg, rgba(255, 255, 255, 0.92) 0%, rgba(240, 247, 243, 0.88) 100%);
            --bg-card: rgba(255, 255, 255, 0.95);
            --bg-input: #FFFFFF;
            --bg-hover: rgba(0, 0, 0, 0.04);
            --bg-active: rgba(23, 107, 82, 0.12);

            --glass-border: rgba(255, 255, 255, 0.9);
            --glass-border-strong: rgba(23, 107, 82, 0.28);
            --glass-specular: inset 1.5px 1.5px 1.5px 0 rgba(255, 255, 255, 1), inset -1px -1px 1px 0 rgba(23, 107, 82, 0.08);

            --shadow-subtle: 0 4px 12px -2px rgba(20, 48, 38, 0.06);
            --shadow-float: 0 16px 36px -6px rgba(20, 48, 38, 0.1);
            --shadow-lift: 0 24px 48px -10px rgba(18, 44, 35, 0.18), 0 0 20px rgba(23, 107, 82, 0.14);

            --text-primary: #121F1B;
            --text-secondary: #405B52;
            --text-tertiary: #759288;
            --text-inverse: #FFFFFF;

            --accent-brand: #176B52;
            --accent-brand-hover: #0F4F3C;
            --accent-brand-soft: rgba(23, 107, 82, 0.12);
            --accent-glow: rgba(23, 107, 82, 0.22);

            --danger: #EF4444;
            --warning: #F59E0B;
            --success: #10B981;

            --editor-gutter: #E8F0EC;
            --editor-selection: rgba(23, 107, 82, 0.18);
            --preview-bg: #FFFFFF;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 13px;
            line-height: 1.5;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            user-select: none;
        }

        :focus-visible {
            outline: 2px solid var(--accent-brand);
            outline-offset: 2px;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 4px; }

        /* ==========================================================================
           1. TOP COMMAND DOCK (macOS SEQUOIA STYLE NAVIGATION)
           ========================================================================== */
        .navbar-island {
            height: var(--nav-height);
            background: var(--bg-dock);
            backdrop-filter: blur(34px) saturate(210%);
            -webkit-backdrop-filter: blur(34px) saturate(210%);
            border-bottom: 1px solid var(--glass-border);
            box-shadow: var(--glass-specular), var(--shadow-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            flex-shrink: 0;
            gap: 12px;
            z-index: 50;
            -webkit-app-region: drag; /* macOS PWA Draggable Header */
        }

        .navbar-island * {
            -webkit-app-region: no-drag;
        }

        .nav-cluster-left,
        .nav-cluster-center,
        .nav-cluster-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-link {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--text-primary);
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 0.92rem;
            letter-spacing: -0.01em;
            padding-right: 12px;
            border-right: 1px solid var(--glass-border);
            transition: transform var(--duration-fast) var(--ease-spring);
        }

        .brand-link:hover { transform: scale(1.04); }

        .brand-gem {
            width: 26px;
            height: 26px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--accent-brand), #1E5C4B);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFFFFF;
            box-shadow: 0 2px 8px var(--accent-glow);
            font-size: 11px;
            font-weight: 800;
        }

        .site-links {
            display: flex;
            list-style: none;
            gap: 2px;
        }

        .site-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 12.5px;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: var(--radius-pill);
            transition: all var(--duration-fast) var(--ease-spring);
        }

        .site-links a:hover {
            color: var(--text-primary);
            background: var(--accent-brand-soft);
            transform: scale(1.04);
        }

        .site-links a.active {
            color: var(--text-primary);
            background: var(--bg-active);
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.1);
            font-weight: 600;
        }

        .project-title-input {
            background: var(--bg-input);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-specular);
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-weight: 600;
            font-size: 13px;
            padding: 6px 14px;
            border-radius: var(--radius-pill);
            width: 140px;
            outline: none;
            transition: all var(--duration-fast) var(--ease-spring);
        }

        .project-title-input:hover { border-color: var(--glass-border-strong); }
        .project-title-input:focus {
            border-color: var(--accent-brand);
            box-shadow: 0 0 0 3px var(--accent-glow), var(--glass-specular);
            width: 200px;
        }

        .save-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11.5px;
            font-family: var(--font-code);
            color: var(--text-tertiary);
            background: var(--bg-surface);
            padding: 5px 12px;
            border-radius: var(--radius-pill);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-specular);
        }

        .save-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 6px var(--success);
            transition: background var(--duration-fast) var(--ease-snappy);
        }

        .save-pill.unsaved .save-dot {
            background: var(--warning);
            box-shadow: 0 0 6px var(--warning);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-specular), var(--shadow-subtle);
            color: var(--text-primary);
            padding: 7px 14px;
            border-radius: var(--radius-pill);
            font-family: var(--font-sans);
            font-size: 12.5px;
            font-weight: 600;
            line-height: 1;
            cursor: pointer;
            text-decoration: none;
            transition: all var(--duration-fast) var(--ease-spring);
            white-space: nowrap;
        }

        .btn:hover {
            background: var(--bg-hover);
            border-color: var(--glass-border-strong);
            transform: translateY(-1px) scale(1.03);
        }

        .btn:active { transform: scale(0.96); }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-brand) 0%, #1D8A68 100%);
            border-color: transparent;
            color: #FFFFFF;
            box-shadow: 0 4px 14px var(--accent-glow);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--accent-brand-hover) 0%, #157356 100%);
            box-shadow: 0 6px 18px var(--accent-glow);
            color: #FFFFFF;
        }

        .btn-icon {
            padding: 7px 10px;
            border-radius: var(--radius-pill);
        }

        .btn-pwa-install {
            display: none;
            background: linear-gradient(135deg, #10B981, var(--accent-brand));
            color: #050807;
            font-weight: 700;
        }

        .btn-group {
            display: inline-flex;
            background: var(--bg-input);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-specular);
            border-radius: var(--radius-pill);
            padding: 2px;
        }

        .btn-group .btn {
            background: transparent;
            border: none;
            box-shadow: none;
            border-radius: var(--radius-pill);
            padding: 5px 11px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .btn-group .btn:hover { transform: none; color: var(--text-primary); }
        .btn-group .btn.active {
            background: var(--bg-card);
            color: var(--text-primary);
            font-weight: 700;
            box-shadow: var(--shadow-subtle), var(--glass-specular);
        }

        /* Dropdowns */
        .dropdown { position: relative; }
        .dropdown-menu {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            background: var(--bg-dock);
            backdrop-filter: blur(32px) saturate(200%);
            -webkit-backdrop-filter: blur(32px) saturate(200%);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-specular), var(--shadow-lift);
            border-radius: var(--radius-md);
            padding: 6px;
            min-width: 210px;
            z-index: 100;
        }

        .dropdown.open .dropdown-menu {
            display: flex;
            flex-direction: column;
            gap: 2px;
            animation: fadeInMenu 180ms var(--ease-spring);
        }

        @keyframes fadeInMenu {
            from { opacity: 0; transform: translateY(-6px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .dropdown-item {
            background: transparent;
            border: none;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 12.5px;
            font-family: var(--font-sans);
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all var(--duration-fast) var(--ease-spring);
        }

        .dropdown-item:hover {
            background: var(--accent-brand-soft);
            color: var(--accent-brand);
            transform: translateX(2px);
        }

        .dropdown-item .hint {
            font-size: 10.5px;
            color: var(--text-tertiary);
            font-family: var(--font-code);
        }

        /* ==========================================================================
           2. WORKSPACE LAYOUT
           ========================================================================== */
        .workspace {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
            background: var(--bg-canvas);
        }

        /* Sidebar: File Tree & Snapshots */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-surface);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-right: 1px solid var(--glass-border);
            box-shadow: var(--glass-specular);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: width var(--duration-normal) var(--ease-spring);
            overflow: hidden;
            z-index: 10;
        }

        .sidebar.collapsed { width: 0; border-right: none; }

        .sidebar-header {
            height: var(--tab-height);
            border-bottom: 1px solid var(--glass-border);
            padding: 0 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-tertiary);
        }

        .file-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 6px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 7px 10px;
            border-radius: var(--radius-sm);
            font-size: 12.5px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--duration-fast) var(--ease-spring);
        }

        .file-item:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
            transform: translateX(2px);
        }

        .file-item.active {
            background: var(--bg-active);
            color: var(--text-primary);
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.1);
            font-weight: 600;
        }

        .file-item-title {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-icon {
            font-family: var(--font-code);
            font-size: 11px;
            color: var(--text-tertiary);
            width: 16px;
            text-align: center;
        }

        .file-item.active .file-icon { color: var(--accent-brand); }
        .file-actions { display: none; gap: 2px; }
        .file-item:hover .file-actions { display: flex; }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-tertiary);
            padding: 4px 6px;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all var(--duration-fast) var(--ease-spring);
        }

        .icon-btn:hover {
            color: var(--text-primary);
            background: var(--bg-hover);
            transform: scale(1.1);
        }

        /* Editor Section */
        .editor-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-canvas);
            min-width: 250px;
            overflow: hidden;
            position: relative;
        }

        .tabs-bar {
            height: var(--tab-height);
            background: var(--bg-surface);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            overflow-x: auto;
            flex-shrink: 0;
            gap: 6px;
        }

        .tabs-list {
            display: flex;
            align-items: center;
            gap: 4px;
            height: 100%;
        }

        .tab {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: transparent;
            border: 1px solid transparent;
            border-radius: var(--radius-pill);
            color: var(--text-secondary);
            font-family: var(--font-code);
            font-size: 11.5px;
            cursor: pointer;
            transition: all var(--duration-fast) var(--ease-spring);
        }

        .tab:hover { background: var(--bg-hover); color: var(--text-primary); }
        .tab.active {
            background: var(--bg-card);
            color: var(--text-primary);
            border-color: var(--glass-border);
            box-shadow: var(--glass-specular), var(--shadow-subtle);
            font-weight: 600;
        }

        .tab-close {
            font-size: 11px;
            padding: 1px 4px;
            border-radius: var(--radius-pill);
            color: var(--text-tertiary);
            transition: all var(--duration-fast) var(--ease-spring);
        }

        .tab-close:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
            transform: scale(1.15);
        }

        /* Editor Area */
        .editor-container {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
            background: var(--bg-canvas);
        }

        .gutter {
            width: 48px;
            background: var(--editor-gutter);
            border-right: 1px solid var(--glass-border);
            padding: 14px 8px;
            color: var(--text-tertiary);
            font-family: var(--font-code);
            font-size: 12px;
            line-height: 1.6;
            text-align: right;
            user-select: none;
            overflow: hidden;
            flex-shrink: 0;
        }

        .code-textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            padding: 14px;
            color: var(--text-primary);
            font-family: var(--font-code);
            font-size: 12.5px;
            line-height: 1.6;
            resize: none;
            white-space: pre;
            tab-size: 2;
            overflow: auto;
            caret-color: var(--accent-brand);
            user-select: text;
        }

        .code-textarea.wrap-text { white-space: pre-wrap; word-break: break-all; }
        .code-textarea::selection { background: var(--editor-selection); }

        .pane-divider {
            width: 5px;
            background: var(--glass-border);
            cursor: col-resize;
            transition: background var(--duration-fast) var(--ease-snappy);
            z-index: 20;
            flex-shrink: 0;
        }

        .pane-divider:hover, .pane-divider.dragging {
            background: var(--accent-brand);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* Preview Stage */
        .preview-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-canvas);
            min-width: 250px;
            overflow: hidden;
        }

        .preview-toolbar {
            height: var(--tab-height);
            background: var(--bg-surface);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            flex-shrink: 0;
        }

        .preview-stage {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-canvas);
            padding: 14px;
            overflow: hidden;
            position: relative;
        }

        .preview-viewport {
            width: 100%;
            height: 100%;
            background: var(--preview-bg);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-specular), var(--shadow-float);
            border-radius: var(--radius-md);
            transition: width var(--duration-normal) var(--ease-spring),
                        height var(--duration-normal) var(--ease-spring);
            position: relative;
            overflow: hidden;
        }

        #sandbox-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #FFFFFF;
        }

        /* Debug Console */
        .console-drawer {
            height: 140px;
            background: var(--bg-surface);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-top: 1px solid var(--glass-border);
            box-shadow: var(--glass-specular);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: height var(--duration-normal) var(--ease-spring);
        }

        .console-drawer.collapsed { height: var(--status-height); }

        .console-header {
            height: var(--status-height);
            background: var(--bg-dock);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            font-size: 11px;
            font-family: var(--font-code);
            color: var(--text-secondary);
        }

        .console-logs {
            flex: 1;
            padding: 8px 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-family: var(--font-code);
            font-size: 11.5px;
            background: var(--bg-canvas);
            user-select: text;

    <script>
        const STORAGE_PROJECTS = 'afk_studio_projects_v3';
        const STORAGE_ACTIVE_ID = 'afk_studio_active_id_v3';

        const codeTextarea = document.getElementById('code-textarea');
        const gutter = document.getElementById('gutter');
        const projectTitleInput = document.getElementById('project-title-input');
        const saveTag = document.getElementById('save-tag');
        const saveStatusText = document.getElementById('save-status-text');
        const projectCountBadge = document.getElementById('project-count');
        const fileListContainer = document.getElementById('file-list-container');
        const tabsContainer = document.getElementById('tabs-container');
        const sandboxFrame = document.getElementById('sandbox-frame');
        const consoleLogs = document.getElementById('console-logs');
        const consoleCounter = document.getElementById('console-counter');
        const replInput = document.getElementById('repl-input');
        const previewViewport = document.getElementById('preview-viewport');
        const statusCursor = document.getElementById('status-cursor');
        const statusFileInfo = document.getElementById('status-file-info');

        let activeProjectId = null;
        let activeFilePath = "index.html";
        let openTabs = ["index.html"];
        let liveReloadEnabled = true;
        let autoSaveTimer = null;
        let autoRunTimer = null;
        let consoleLogCount = 0;
        let isWordWrap = false;
        let activeBlobUrl = null;
        
        // Native Desktop File System Handle
        let localFileHandle = null;
        let localDirHandle = null;

        /* --------------------------------------------------------------------------
           1. PWA REGISTRATION & WEB APP MANIFEST
           -------------------------------------------------------------------------- */
        let deferredInstallPrompt = null;
        const pwaBtn = document.getElementById('pwa-install-btn');

        // Dynamically inject standalone PWA manifest
        const manifestObj = {
            name: "I’M AFK Web Studio",
            short_name: "AFK Studio",
            start_url: window.location.href,
            display: "standalone",
            background_color: "#050807",
            theme_color: "#14201C",
            icons: [{ src: "icon.png", sizes: "192x192 512x512", type: "image/png" }]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
        const manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = URL.createObjectURL(manifestBlob);
        document.head.appendChild(manifestLink);

        // Catch PWA Install Prompt
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredInstallPrompt = e;
            pwaBtn.style.display = 'inline-flex';
        });

        async function installPWA() {
            if (!deferredInstallPrompt) return;
            deferredInstallPrompt.prompt();
            const { outcome } = await deferredInstallPrompt.userChoice;
            if (outcome === 'accepted') {
                pwaBtn.style.display = 'none';
                showToast("Studio installed as Web App!");
            }
            deferredInstallPrompt = null;
        }

        /* --------------------------------------------------------------------------
           2. NATIVE FILE SYSTEM ACCESS API (Direct Hard Drive Editing)
           -------------------------------------------------------------------------- */
        async function openLocalFolder() {
            if (!('showDirectoryPicker' in window)) {
                alert("File System Access API is not supported in this browser. Please use Chrome, Edge, or Brave.");
                return;
            }
            try {
                localDirHandle = await window.showDirectoryPicker();
                const folderName = localDirHandle.name;
                const newFiles = [];

                for await (const entry of localDirHandle.values()) {
                    if (entry.kind === 'file') {
                        const file = await entry.getFile();
                        const text = await file.text();
                        const ext = file.name.split('.').pop().toLowerCase();
                        newFiles.push({
                            name: file.name,
                            path: file.name,
                            type: ext,
                            content: text,
                            handle: entry
                        });
                    }
                }

                if (newFiles.length === 0) {
                    alert("No files found in folder.");
                    return;
                }

                const manifest = JSON.parse(localStorage.getItem(STORAGE_PROJECTS) || '[]');
                const newProj = {
                    id: 'proj_' + Date.now(),
                    title: `📁 ${folderName}`,
                    files: newFiles,
                    updatedAt: Date.now(),
                    snapshots: []
                };
                manifest.unshift(newProj);
                localStorage.setItem(STORAGE_PROJECTS, JSON.stringify(manifest));
                
                document.getElementById('status-fs-mode').textContent = `📁 ${folderName}`;
                switchProject(newProj.id);
                showToast(`Loaded workspace from disk: ${folderName}`);
            } catch (err) {
                if (err.name !== 'AbortError') console.error(err);
            }
        }

        async function openLocalFile() {
            if (!('showOpenFilePicker' in window)) {
                alert("File System Access is not supported in this browser.");
                return;
            }
            try {
                const [handle] = await window.showOpenFilePicker();
                localFileHandle = handle;
                const file = await handle.getFile();
                const text = await file.text();

                const project = getActiveProject();
                const ext = file.name.split('.').pop().toLowerCase();
                project.files.push({
                    name: file.name,
                    path: file.name,
                    type: ext,
                    content: text,
                    handle: handle
                });

                saveActiveProject(true);
                switchActiveFile(file.name);
                showToast(`Opened from disk: ${file.name}`);
            } catch (err) {
                if (err.name !== 'AbortError') console.error(err);
            }
        }

        async function saveToDisk() {
            const project = getActiveProject();
            const currentFile = project.files.find(f => f.path === activeFilePath);

            try {
                let handle = currentFile && currentFile.handle ? currentFile.handle : localFileHandle;
                
                if (!handle && 'showSaveFilePicker' in window) {
                    handle = await window.showSaveFilePicker({ suggestedName: activeFilePath });
                }

                if (handle) {
                    const writable = await handle.createWritable();
                    await writable.write(codeTextarea.value);
                    await writable.close();
                    showToast(`Saved to hard drive: ${handle.name || activeFilePath}`);
                    saveTag.classList.remove('unsaved');
                    saveStatusText.textContent = 'Saved to Disk';
                    return;
                }
            } catch (err) {
                console.warn(err);
            }
            // Fallback to normal download
            exportStandaloneHTML();
        }

        /* --------------------------------------------------------------------------
           3. OS DRAG & DROP INGESTION
           -------------------------------------------------------------------------- */
        const dropZone = document.getElementById('editor-drop-zone');

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.border = '2px dashed var(--accent-brand)';
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.style.border = 'none';
        });

        dropZone.addEventListener('drop', async (e) => {
            e.preventDefault();
            dropZone.style.border = 'none';

            if (e.dataTransfer.files.length > 0) {
                for (const file of e.dataTransfer.files) {
                    const text = await file.text();
                    const ext = file.name.split('.').pop().toLowerCase();
                    const project = getActiveProject();

                    project.files.push({
                        name: file.name,
                        path: file.name,
                        type: ext,
                        content: text
                    });
                    saveActiveProject(true);
                    switchActiveFile(file.name);
                    showToast(`Ingested file: ${file.name}`);

        });

        /* --------------------------------------------------------------------------
           4. SPOTLIGHT COMMAND PALETTE (Ctrl+K or Ctrl+Shift+P)

        const paletteList = document.getElementById('palette-list');

            { label: "▶ Run Application", action: runSandbox, hint: "Ctrl+Enter" },

            { label: "📁 Open Local Folder", action: openLocalFolder, hint: "Hard Drive" },
            { label: "✨ Format Active File", action: formatActiveFile, hint: "Beautify" },
            { label: "📤 Export Standalone HTML", action: exportStandaloneHTML, hint: "Download" },
            { label: "🌓 Toggle Light / Dark Theme", action: toggleTheme, hint: "Visual" },
            { label: "📑 Take Project Snapshot", action: takeSnapshot, hint: "Bookmark" }
        ];

        function openPalette() {
            paletteOverlay.classList.add('active');
            document.getElementById('palette-input').focus();
            filterPalette('');

        function closePalette() {
            paletteOverlay.classList.remove('active');

        function closePaletteOnBackdrop(e) {
            if (e.target === paletteOverlay) closePalette();
        }

        function filterPalette(query) {

            // Add Actions
            COMMANDS.filter(c => c.label.toLowerCase().includes(q)).forEach(cmd => {

        /* --------------------------------------------------------------------------
           5. CORE STUDIO ENGINE & LIVE EXECUTION
           -------------------------------------------------------------------------- */
        function initStudio() {
            let manifest = JSON.parse(localStorage.getItem(STORAGE_PROJECTS) || 'null');
            if (!manifest || manifest.length === 0) {
                const defaultProject = {
                    id: 'proj_' + Date.now(),

                    files: [
                        {
                            name: "index.html",
                            path: "index.html",
                            type: "html",
                            content: `<!DOCTYPE html>\n<html>\n<head>\n  <meta charset="utf-8">\n  <title>App</title>\n  <link rel="stylesheet" href="style.css">\n</head>\n<body>\n  <div class="card">\n    <h1>I’M AFK Web Studio</h1>\n    <p>A full standalone desktop web app environment.</p>\n    <button id="btn">Click me: 0</button>\n  </div>\n  <script src="app.js"><\/script>\n</body>\n</html>`
                        },
                        {
                            name: "style.css",
                            path: "style.css",
                            type: "css",
                            content: `body { margin:0; background:#050807; color:#F2F8F5; font-family:sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; }\n.card { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); padding:32px; border-radius:20px; text-align:center; }\nbutton { background:#38E1A6; border:none; color:#050807; padding:10px 20px; border-radius:999px; font-weight:700; cursor:pointer; }`
                        },
                        {
                            name: "app.js",
                            path: "app.js",
                            type: "js",
                            content: `let count = 0;\ndocument.getElementById('btn').onclick = () => {\n  count++;\n  document.getElementById('btn').innerText = 'Click me: ' + count;\n  console.log('Clicked: ' + count);\n};\nconsole.log('App ready in Web App mode.');`
                        }
                    ],
                    updatedAt: Date.now(),
                    snapshots: []
                };
                manifest = [defaultProject];
                localStorage.setItem(STORAGE_PROJECTS, JSON.stringify(manifest));
                localStorage.setItem(STORAGE_ACTIVE_ID, defaultProject.id);
            }

            activeProjectId = localStorage.getItem(STORAGE_ACTIVE_ID) || manifest[0].id;
            const project = manifest.find(p => p.id === activeProjectId) || manifest[0];
            activeProjectId = project.id;

            loadProjectState(project);
            updateProjectCount();
            runSandbox();
        }

        function getActiveProject() {
            const manifest = JSON.parse(localStorage.getItem(STORAGE_PROJECTS) || '[]');
            return manifest.find(p => p.id === activeProjectId) || manifest[0];
        }

        function loadProjectState(project) {
            projectTitleInput.value = project.title;
            if (!project.files.some(f => f.path === activeFilePath)) {
                activeFilePath = project.files[0] ? project.files[0].path : "";
            }
            if (!openTabs.includes(activeFilePath) && activeFilePath) {
                openTabs = [activeFilePath];
            }
            renderFileList();
            renderTabs();
            loadActiveFileContent();
            renderSnapshotsList(project.snapshots || []);
        }

        function saveActiveProject(silent = false) {
            const manifest = JSON.parse(localStorage.getItem(STORAGE_PROJECTS) || '[]');
            const idx = manifest.findIndex(p => p.id === activeProjectId);
            if (idx === -1) return;

            const file = manifest[idx].files.find(f => f.path === activeFilePath);
            if (file) file.content = codeTextarea.value;

            manifest[idx].title = projectTitleInput.value.trim() || 'Untitled';
            manifest[idx].updatedAt = Date.now();

            localStorage.setItem(STORAGE_PROJECTS, JSON.stringify(manifest));
            saveTag.classList.remove('unsaved');
            saveStatusText.textContent = 'Saved';

            if (!silent) showToast('Saved');
        }

        function triggerChange() {
            saveTag.classList.add('unsaved');
            saveStatusText.textContent = 'Unsaved';

            clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(() => saveActiveProject(true), 600);

            if (liveReloadEnabled) {
                clearTimeout(autoRunTimer);
                autoRunTimer = setTimeout(() => runSandbox(true), 800);
            }
        }

        function updateProjectCount() {
            const manifest = JSON.parse(localStorage.getItem(STORAGE_PROJECTS) || '[]');
            projectCountBadge.textContent = manifest.length;
        }

        function renderFileList() {
            const project = getActiveProject();
            if (!project) return;

            fileListContainer.innerHTML = '';
            project.files.forEach(file => {
                const item = document.createElement('div');
                item.className = `file-item ${file.path === activeFilePath ? 'active' : ''}`;
                item.innerHTML = `
                    <div class="file-item-title" onclick="switchActiveFile('${file.path}')">
                        <span class="file-icon">${file.type === 'html' ? '&lt;&gt;' : (file.type === 'css' ? '#' : (file.type === 'js' ? 'JS' : '•'))}</span>
                        <span>${file.name}</span>
                    </div>
                    <div class="file-actions">
                        ${project.files.length > 1 ? `<button class="icon-btn" onclick="deleteFile('${file.path}', event)">✕</button>` : ''}
                    </div>
                `;
                fileListContainer.appendChild(item);
            });
        }

        function renderTabs() {
            tabsContainer.innerHTML = '';
            openTabs.forEach(path => {
                const file = getActiveProject().files.find(f => f.path === path);
                if (!file) return;

                const tab = document.createElement('button');
                tab.className = `tab ${path === activeFilePath ? 'active' : ''}`;
                tab.onclick = () => switchActiveFile(path);
                tab.innerHTML = `<span>${file.name}</span><span class="tab-close" onclick="closeTab('${path}', event)">✕</span>`;
                tabsContainer.appendChild(tab);
            });
        }

        function switchActiveFile(path) {
            const project = getActiveProject();
            const curFile = project.files.find(f => f.path === activeFilePath);
            if (curFile) curFile.content = codeTextarea.value;

            activeFilePath = path;
            if (!openTabs.includes(path)) openTabs.push(path);

            renderFileList();
            renderTabs();
            loadActiveFileContent();
        }

        function closeTab(path, e) {
            if (e) e.stopPropagation();
            openTabs = openTabs.filter(p => p !== path);
            if (activeFilePath === path) {
                activeFilePath = openTabs.length > 0 ? openTabs[openTabs.length - 1] : "";
            }
            renderTabs();
            renderFileList();
            loadActiveFileContent();
        }

        function loadActiveFileContent() {
            const project = getActiveProject();
            const file = project.files.find(f => f.path === activeFilePath);
            if (file) {
                codeTextarea.value = file.content;
                codeTextarea.disabled = false;
            } else {
                codeTextarea.value = '';
                codeTextarea.disabled = true;
            }
            updateMetrics();
        }

        function promptNewFile() {
            const name = prompt("File name (e.g. style.css, script.js):");
            if (!name || !name.trim()) return;

            const cleanName = name.trim();
            const ext = cleanName.split('.').pop().toLowerCase();
            const project = getActiveProject();

            project.files.push({ name: cleanName, path: cleanName, type: ext, content: '' });
            saveActiveProject(true);
            switchActiveFile(cleanName);
        }

        function deleteFile(path, e) {
            if (e) e.stopPropagation();
            if (!confirm(`Delete ${path}?`)) return;

            const project = getActiveProject();
            project.files = project.files.filter(f => f.path !== path);
            openTabs = openTabs.filter(t => t !== path);
            activeFilePath = project.files[0] ? project.files[0].path : "";

            saveActiveProject(true);
            renderFileList();
            renderTabs();
            loadActiveFileContent();
        }

        function updateMetrics() {
            requestAnimationFrame(() => {
                const text = codeTextarea.value;
                const lines = text.split('\n').length;
                gutter.innerHTML = Array.from({ length: lines }, (_, i) => i + 1).join('<br>');
                statusFileInfo.textContent = `${lines} lines`;
            });
        }

        codeTextarea.addEventListener('input', () => { updateMetrics(); triggerChange(); });
        codeTextarea.addEventListener('scroll', () => { gutter.scrollTop = codeTextarea.scrollTop; });
        codeTextarea.addEventListener('click', updateCursorPos);
        codeTextarea.addEventListener('keyup', updateCursorPos);

        function updateCursorPos() {
            const pos = codeTextarea.selectionStart;
            const lines = codeTextarea.value.substring(0, pos).split('\n');
            statusCursor.textContent = `Ln ${lines.length}, Col ${lines[lines.length - 1].length + 1}`;
        }

        // Global Desktop Shortcuts
        window.addEventListener('keydown', (e) => {
            const isCmd = e.ctrlKey || e.metaKey;

            // Command Palette (Ctrl/Cmd + K or Ctrl/Cmd + Shift + P)
            if ((isCmd && e.key === 'k') || (isCmd && e.shiftKey && (e.key === 'P' || e.key === 'p'))) {
                e.preventDefault();
                openPalette();
                return;
            }

            // Save to Disk or Project (Ctrl/Cmd + S)
            if (isCmd && (e.key === 's' || e.key === 'S')) {
                e.preventDefault();
                saveToDisk();
                return;
            }

            // Run (Ctrl/Cmd + Enter)
            if (isCmd && e.key === 'Enter') {
                e.preventDefault();
                runSandbox();
                return;
            }

            // Escape closes overlays
            if (e.key === 'Escape') {
                closePalette();
                closeProjectsModal();
                closeSettingsModal();
            }
        });

        // Tab & Indenting in Editor
        codeTextarea.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = codeTextarea.selectionStart;
                const end = codeTextarea.selectionEnd;
                codeTextarea.value = codeTextarea.value.substring(0, start) + "  " + codeTextarea.value.substring(end);
                codeTextarea.selectionStart = codeTextarea.selectionEnd = start + 2;
                updateMetrics();
                triggerChange();
            }
        });

        projectTitleInput.addEventListener('input', triggerChange);

        function formatActiveFile() {
            const lines = codeTextarea.value.split('\n');
            let indent = 0;
            const formatted = lines.map(line => {
                const t = line.trim();
                if (t.startsWith('</') || t.startsWith('}') || t.startsWith(']')) indent = Math.max(0, indent - 1);
                const out = '  '.repeat(indent) + t;
                if ((t.endsWith('{') || (t.startsWith('<') && !t.startsWith('</') && !t.endsWith('/>') && !t.includes('</'))) && !t.startsWith('<!')) indent++;
                return out;
            }).join('\n');

            codeTextarea.value = formatted;
            updateMetrics();
            triggerChange();
            showToast('Code formatted');
        }

        /* --------------------------------------------------------------------------
           6. COMPILER & ISOLATED SANDBOX
           -------------------------------------------------------------------------- */
        function runSandbox(silent = false) {
            saveActiveProject(true);
            const project = getActiveProject();
            if (!project) return;

            const htmlFile = project.files.find(f => f.path.endsWith('.html')) || project.files[0];
            if (!htmlFile) return;

            let bundle = htmlFile.content;

            project.files.filter(f => f.type === 'css').forEach(css => {
                bundle = bundle.replace('</head>', `<style>/* ${css.name} */\n${css.content}\n</style></head>`);
            });

            project.files.filter(f => f.type === 'js').forEach(js => {
                bundle = bundle.replace('</body>', `<script>/* ${js.name} */\n${js.content}\n<\/script></body>`);
            });

            const bridge = `
                <script>
                    (function(){
                        const _log = console.log, _warn = console.warn, _err = console.error;
                        console.log = (...args) => { _log(...args); window.parent.postMessage({ type: 'CONSOLE_LOG', level: 'info', text: args.join(' ') }, '*'); };
                        console.warn = (...args) => { _warn(...args); window.parent.postMessage({ type: 'CONSOLE_LOG', level: 'warn', text: args.join(' ') }, '*'); };
                        console.error = (...args) => { _err(...args); window.parent.postMessage({ type: 'CONSOLE_LOG', level: 'error', text: args.join(' ') }, '*'); };
                    })();
                <\/script>
            `;
            bundle = bundle.includes('<head>') ? bundle.replace('<head>', '<head>' + bridge) : bridge + bundle;

            if (activeBlobUrl) URL.revokeObjectURL(activeBlobUrl);

            const blob = new Blob([bundle], { type: 'text/html' });
            activeBlobUrl = URL.createObjectURL(blob);
            sandboxFrame.src = activeBlobUrl;

            if (!silent) appendConsoleLog('Application bundle recompiled.', 'system');
        }

        window.addEventListener('message', (e) => {
            if (e.data && e.data.type === 'CONSOLE_LOG') appendConsoleLog(e.data.text, e.data.level);
        });

        function appendConsoleLog(text, level = 'info') {
            consoleLogCount++;
            consoleCounter.textContent = consoleLogCount;
            const row = document.createElement('div');
            row.className = `log-row ${level}`;
            row.textContent = `❯ ${text}`;
            consoleLogs.appendChild(row);
            consoleLogs.scrollTop = consoleLogs.scrollHeight;
        }

        function clearConsole() {
            consoleLogs.innerHTML = '';
            consoleLogCount = 0;
            consoleCounter.textContent = '0';
        }

        function toggleConsole() {
            document.getElementById('console-drawer').classList.toggle('collapsed');
        }

        function handleReplKey(e) {
            if (e.key === 'Enter') {
                const cmd = replInput.value.trim();
                if (!cmd) return;
                appendConsoleLog(cmd, 'repl');
                try { sandboxFrame.contentWindow.eval(cmd); }
                catch(err) { appendConsoleLog(err.message, 'error'); }
                replInput.value = '';
            }
        }

           7. WORKSPACE CONTROLS & EXPORTS

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); }

        function setPreviewViewport(w, h, btn) {
            document.querySelectorAll('.preview-toolbar .btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            previewViewport.style.width = w;
            previewViewport.style.height = h;

        function openPreviewNewTab() {
            const project = getActiveProject();
            const htmlFile = project.files.find(f => f.path.endsWith('.html')) || project.files[0];
            if (!htmlFile) return;
            const win = window.open();
            win.document.write(htmlFile.content);

        }

        function toggleLiveReload() {
            liveReloadEnabled = !liveReloadEnabled;
            document.getElementById('live-status-text').textContent = liveReloadEnabled ? 'On' : 'Off';
            showToast(`Live Auto-Run: ${liveReloadEnabled ? 'On' : 'Off'}`);
        }

        function exportStandaloneHTML() {
            const project = getActiveProject();
            const htmlFile = project.files.find(f => f.path.endsWith('.html')) || project.files[0];
            if (!htmlFile) return;

            let bundle = htmlFile.content;
            project.files.filter(f => f.type === 'css').forEach(css => bundle = bundle.replace('</head>', `<style>\n${css.content}\n</style></head>`));
            project.files.filter(f => f.type === 'js').forEach(js => bundle = bundle.replace('</body>', `<script>\n${js.content}\n<\/script></body>`));

            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([bundle], { type: 'text/html' }));
            a.download = `${project.title.toLowerCase().replace(/\s+/g, '_')}.html`;
            a.click();
            showToast('Exported Standalone HTML');
        }

        function exportProjectJSON() {
            const project = getActiveProject();
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([JSON.stringify(project, null, 2)], { type: 'application/json' }));
            a.download = `${project.title.toLowerCase().replace(/\s+/g, '_')}.json`;
            a.click();
            showToast('Exported Project Bundle');
        }

        /* Snapshots */
        function takeSnapshot() {
            const project = getActiveProject();
            if (!project.snapshots) project.snapshots = [];
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            project.snapshots.unshift({ id: 'snap_' + Date.now(), label: `Snapshot at ${time}`, files: JSON.parse(JSON.stringify(project.files)) });
            if (project.snapshots.length > 6) project.snapshots.pop();
            saveActiveProject(true);
            renderSnapshotsList(project.snapshots);
            showToast("Snapshot saved");
        }

        function renderSnapshotsList(snapshots) {
            const list = document.getElementById('snapshots-list');
            if (!snapshots || snapshots.length === 0) {
                list.innerHTML = '<span style="font-size:11px; color:var(--text-tertiary); padding:0 14px;">No snapshots yet.</span>';
                return;
            }
            list.innerHTML = snapshots.map(s => `
                <div class="file-item" onclick="restoreSnapshot('${s.id}')">
                    <span>${s.label}</span>
                    <span style="font-size:10px; color:var(--accent-brand); font-weight:700;">Restore</span>
                </div>
            `).join('');
        }

        function restoreSnapshot(snapId) {
            const project = getActiveProject();
            const snap = project.snapshots.find(s => s.id === snapId);
            if (!snap || !confirm(`Restore ${snap.label}?`)) return;
            project.files = JSON.parse(JSON.stringify(snap.files));
            saveActiveProject(true);
            loadProjectState(project);
            runSandbox();
            showToast("Restored snapshot");
        }

        function openSettingsModal() { document.getElementById('settings-modal').classList.add('active'); }
        function closeSettingsModal() { document.getElementById('settings-modal').classList.remove('active'); }

        function createNewProjectPrompt() {

            const newProj = {
                id: 'proj_' + Date.now(),

        function toggleTheme() {

        function showToast(msg) {

            container.appendChild(toast);
            setTimeout(() => toast.remove(), 2200);

        // Draggable Resizer
        const paneDivider = document.getElementById('pane-divider');
        const editorPane = document.getElementById('editor-pane');
        const workspaceContainer = document.getElementById('workspace-container');
        let isResizing = false;

        paneDivider.addEventListener('mousedown', () => { isResizing = true; paneDivider.classList.add('dragging'); });
        window.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            const bounds = workspaceContainer.getBoundingClientRect();
            const pct = ((e.clientX - bounds.left) / bounds.width) * 100;
            if (pct > 20 && pct < 80) editorPane.style.flex = `0 0 ${pct}%`;
        });
        window.addEventListener('mouseup', () => { if (isResizing) { isResizing = false; paneDivider.classList.remove('dragging'); } });

        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('afk_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            initStudio();
        });
    </script>
</body>
</html>
