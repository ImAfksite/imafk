<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Studio — I’M AFK</title>
    <link rel="icon" type="image/png" href="icon.png">
    
    <!-- PWA / Mobile Web App Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AFK Studio">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#050807">
    
    <!-- Inline Data-URI PWA Manifest -->
    <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22I%E2%80%99M%20AFK%20Web%20Studio%22%2C%22short_name%22%3A%22AFKStudio%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23050807%22%2C%22theme_color%22%3A%22%2314201C%22%7D">

    <!-- Typography: Inter + Space Grotesk + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================================
           DESIGN TOKENS — MACOS LIQUID GLASS SYSTEM
           ========================================================================== */
        :root {
            --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
            --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Space Grotesk", sans-serif;
            --font-code: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;

            --radius-xs: 8px;
            --radius-sm: 12px;
            --radius-md: 18px;
            --radius-lg: 26px;
            --radius-pill: 9999px;

            --ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --ease-bounce: cubic-bezier(0.175, 0.885, 0.32, 1.55);
            --ease-snappy: cubic-bezier(0.16, 1, 0.3, 1);
            --duration-fast: 160ms;
            --duration-normal: 260ms;

            --nav-height: 54px;
            --tab-height: 40px;
            --status-height: 32px;
            --sidebar-width: 250px;
        }

        /* ---------------- Theme: Dark ---------------- */
        [data-theme="dark"] {
            --bg-canvas: #050807;
            --bg-surface: linear-gradient(145deg, rgba(255, 255, 255, 0.08) 0%, rgba(18, 30, 26, 0.72) 45%, rgba(8, 16, 13, 0.9) 100%);
            --bg-dock: linear-gradient(180deg, rgba(20, 32, 28, 0.86) 0%, rgba(10, 16, 14, 0.95) 100%);
            --bg-card: rgba(22, 34, 30, 0.75);
            --bg-input: rgba(10, 16, 14, 0.85);
            --bg-hover: rgba(255, 255, 255, 0.06);
            --bg-active: rgba(56, 225, 166, 0.16);

            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-border-strong: rgba(56, 225, 166, 0.35);
            --glass-specular: inset 1.5px 1.5px 1px 0 rgba(255, 255, 255, 0.22), inset -1px -1px 1px 1px rgba(56, 225, 166, 0.12);

            --shadow-subtle: 0 4px 14px -3px rgba(0, 0, 0, 0.5);
            --shadow-float: 0 16px 36px -8px rgba(0, 0, 0, 0.75);
            --shadow-lift: 0 24px 48px -12px rgba(0, 0, 0, 0.9), 0 0 24px rgba(56, 225, 166, 0.18);

            --text-primary: #F2F8F5;
            --text-secondary: #9DB5AC;
            --text-tertiary: #5D7970;
            --text-inverse: #050807;

            --accent-brand: #38E1A6;
            --accent-brand-hover: #5CF0BC;
            --accent-brand-soft: rgba(56, 225, 166, 0.15);
            --accent-glow: rgba(56, 225, 166, 0.28);

            --danger: #F87171;
            --warning: #FBBF24;
            --success: #34D399;

            --editor-gutter: #080D0B;
            --editor-selection: rgba(56, 225, 166, 0.25);
            --preview-bg: #FFFFFF;
        }

        /* ---------------- Theme: Light ---------------- */
        [data-theme="light"] {
            --bg-canvas: #F0F6F3;
            --bg-surface: linear-gradient(145deg, rgba(255, 255, 255, 0.92) 0%, rgba(240, 248, 244, 0.75) 50%, rgba(230, 242, 236, 0.85) 100%);
            --bg-dock: linear-gradient(180deg, rgba(255, 255, 255, 0.92) 0%, rgba(240, 247, 243, 0.88) 100%);
            --bg-card: rgba(255, 255, 255, 0.95);
            --bg-input: #FFFFFF;
            --bg-hover: rgba(0, 0, 0, 0.04);
            --bg-active: rgba(23, 107, 82, 0.12);

            --glass-border: rgba(255, 255, 255, 0.9);
            --glass-border-strong: rgba(23, 107, 82, 0.28);
            --glass-specular: inset 1.5px 1.5px 1.5px 0 rgba(255, 255, 255, 1), inset -1px -1px 1px 0 rgba(23, 107, 82, 0.08);

            --shadow-subtle: 0 4px 12px -2px rgba(20, 48, 38, 0.06);
            --shadow-float: 0 16px 36px -6px rgba(20, 48, 38, 0.1);
            --shadow-lift: 0 24px 48px -10px rgba(18, 44, 35, 0.18), 0 0 20px rgba(23, 107, 82, 0.14);

            --text-primary: #121F1B;
            --text-secondary: #405B52;
            --text-tertiary: #759288;
            --text-inverse: #FFFFFF;

            --accent-brand: #176B52;
            --accent-brand-hover: #0F4F3C;
            --accent-brand-soft: rgba(23, 107, 82, 0.12);
            --accent-glow: rgba(23, 107, 82, 0.22);

            --danger: #EF4444;
            --warning: #F59E0B;
            --success: #10B981;

            --editor-gutter: #E8F0EC;
            --editor-selection: rgba(23, 107, 82, 0.18);
            --preview-bg: #FFFFFF;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 13px;
            line-height: 1.5;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            user-select: none;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        :focus-visible {
            outline: 2px solid var(--accent-brand);
            outline-offset: 2px;
        }

        /* ==========================================================================
           1. TOP COMMAND DOCK (macOS & MOBILE RESPONSIVE)
           ========================================================================== */
        .navbar-island {
            height: var(--nav-height);
            background: var(--bg-dock);
            backdrop-filter: blur(34px) saturate(210%);
            -webkit-backdrop-filter: blur(34px) saturate(210%);
            border-bottom: 1px solid var(--glass-border);
            box-shadow: var(--glass-specular), var(--shadow-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            flex-shrink: 0;
            gap: 8px;
            z-index: 50;
        }

        .nav-cluster-left,
        .nav-cluster-center,
        .nav-cluster-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .brand-link {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--text-primary);
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 0.92rem;
            letter-spacing: -0.01em;
            padding-right: 10px;
            border-right: 1px solid var(--glass-border);
        }

        .brand-gem {
            width: 26px;
            height: 26px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--accent-brand), #1E5C4B);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFFFFF;
            box-shadow: 0 2px 8px var(--accent-glow);
            font-size: 11px;
            font-weight: 800;
        }

        .site-links {
            display: flex;
            list-style: none;
            gap: 2px;
        }

        .site-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 12.5px;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: var(--radius-pill);
            transition: all var(--duration-fast) var(--ease-spring);
        }

        .site-links a:hover {
            color: var(--text-primary);
            background: var(--accent-brand-soft);
        }

        .site-links a.active {
            color: var(--text-primary);
            background: var(--bg-active);
            font-weight: 600;
        }

        .project-title-input {
            background: var(--bg-input);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-specular);
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-weight: 600;
            font-size: 13px;
            padding: 6px 14px;
            border-radius: var(--radius-pill);
            width: 130px;
            outline: none;
            transition: all var(--duration-fast) var(--ease-spring);
        }

        .project-title-input:focus {
            border-color: var(--accent-brand);
            box-shadow: 0 0 0 3px var(--accent-glow);
            width: 170px;
        }

        .save-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11.5px;
            font-family: var(--font-code);
            color: var(--text-tertiary);
            background: var(--bg-surface);
            padding: 5px 10px;
            border-radius: var(--radius-pill);
            border: 1px solid var(--glass-border);
        }

        .save-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 6px var(--success);
        }

        .save-pill.unsaved .save-dot {
            background: var(--warning);
            box-shadow: 0 0 6px var(--warning);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-specular);
            color: var(--text-primary);
            padding: 7px 14px;
            border-radius: var(--radius-pill);
            font-family: var(--font-sans);
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--duration-fast) var(--ease-spring);
            white-space: nowrap;
        }

        .btn:active { transform: scale(0.96); }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-brand) 0%, #1D8A68 100%);
            border-color: transparent;
            color: #FFFFFF;
            box-shadow: 0 4px 14px var(--accent-glow);
        }

        .btn-icon { padding: 7px 10px; border-radius: var(--radius-pill); }
        .btn-pwa-install { display: none; background: linear-gradient(135deg, #10B981, var(--accent-brand)); color: #050807; font-weight: 700; }

        /* ==========================================================================
           📱 MOBILE VIEW SWITCHER (Segmented control on phones)
           ========================================================================== */
        .mobile-view-tabs {
            display: none;
            background: var(--bg-dock);
            border-bottom: 1px solid var(--glass-border);
            padding: 6px 12px;
            justify-content: space-between;
            gap: 8px;
            flex-shrink: 0;
            z-index: 45;
        }

        .mobile-seg-btn {
            flex: 1;
            padding: 7px;
            border-radius: var(--radius-pill);
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-secondary);
            font-family: var(--font-sans);
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
        }

        .mobile-seg-btn.active {
            background: var(--bg-card);
            border-color: var(--glass-border);
            color: var(--text-primary);
            box-shadow: var(--glass-specular);
        }

        /* Mobile Keyboard Code-Accessory Bar */
        .mobile-code-bar {
            display: none;
            background: var(--bg-dock);
            border-top: 1px solid var(--glass-border);
            padding: 6px 8px;
            overflow-x: auto;
            white-space: nowrap;
            gap: 6px;
            flex-shrink: 0;
            scrollbar-width: none;
        }

        .mobile-code-bar::-webkit-scrollbar { display: none; }

        .m-key {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            font-family: var(--font-code);
            font-weight: 700;
            font-size: 13px;
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            box-shadow: var(--glass-specular);
        }

        .m-key:active {
            background: var(--accent-brand);
            color: #050807;
            transform: scale(0.92);
        }

        /* ==========================================================================
           2. WORKSPACE LAYOUT (DESKTOP + MOBILE DUAL ENGINE)
           ========================================================================== */
        .workspace {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
            background: var(--bg-canvas);
        }

        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-surface);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-right: 1px solid var(--glass-border);
            box-shadow: var(--glass-specular);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: width var(--duration-normal) var(--ease-spring);
            overflow: hidden;
            z-index: 10;
        }

        .sidebar.collapsed { width: 0; border-right: none; }

        .sidebar-header {
            height: var(--tab-height);
            border-bottom: 1px solid var(--glass-border);
            padding: 0 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-tertiary);
        }

        .file-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 6px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            border-radius: var(--radius-sm);
            font-size: 12.5px;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .file-item.active {
            background: var(--bg-active);
            color: var(--text-primary);
            font-weight: 600;
        }

        .file-item-title {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-icon {
            font-family: var(--font-code);
            font-size: 11px;
            color: var(--text-tertiary);
            width: 16px;
        }

        .file-item.active .file-icon { color: var(--accent-brand); }

        .editor-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-canvas);
            min-width: 200px;
            overflow: hidden;
            position: relative;
        }

        .tabs-bar {
            height: var(--tab-height);
            background: var(--bg-surface);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            overflow-x: auto;
            flex-shrink: 0;
            gap: 6px;
        }

        .tabs-list {
            display: flex;
            align-items: center;
            gap: 4px;
            height: 100%;
        }

        .tab {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: transparent;
            border: 1px solid transparent;
            border-radius: var(--radius-pill);
            color: var(--text-secondary);
            font-family: var(--font-code);
            font-size: 11.5px;
            cursor: pointer;
            white-space: nowrap;
        }

        .tab.active {
            background: var(--bg-card);
            color: var(--text-primary);
            border-color: var(--glass-border);
            box-shadow: var(--glass-specular);
            font-weight: 600;
        }

        .tab-close {
            font-size: 11px;
            padding: 1px 4px;
            border-radius: var(--radius-pill);
            color: var(--text-tertiary);
        }

        .editor-container {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
            background: var(--bg-canvas);
        }

        .gutter {
            width: 44px;
            background: var(--editor-gutter);
            border-right: 1px solid var(--glass-border);
            padding: 14px 6px;
            color: var(--text-tertiary);
            font-family: var(--font-code);
            font-size: 12px;
            line-height: 1.6;
            text-align: right;
            user-select: none;
            overflow: hidden;
            flex-shrink: 0;
        }

        .code-textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            padding: 14px;
            color: var(--text-primary);
            font-family: var(--font-code);
            font-size: 13px;
            line-height: 1.6;
            resize: none;
            white-space: pre;
            tab-size: 2;
            overflow: auto;
            caret-color: var(--accent-brand);
            user-select: text;
        }

        .pane-divider {
            width: 5px;
            background: var(--glass-border);
            cursor: col-resize;
            transition: background var(--duration-fast) var(--ease-snappy);
            z-index: 20;
            flex-shrink: 0;
        }

        .preview-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-canvas);
            min-width: 200px;
            overflow: hidden;
        }

        .preview-toolbar {
            height: var(--tab-height);
            background: var(--bg-surface);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            flex-shrink: 0;
        }

        .preview-stage {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-canvas);
            padding: 12px;
            overflow: hidden;
            position: relative;
        }

        .preview-viewport {
            width: 100%;
            height: 100%;
            background: var(--preview-bg);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-specular), var(--shadow-float);
            border-radius: var(--radius-md);
            position: relative;
            overflow: hidden;
        }

        #sandbox-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #FFFFFF;
        }

        .console-drawer {
            height: 130px;
            background: var(--bg-surface);
            border-top: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .console-drawer.collapsed { height: var(--status-height); }

        .console-header {
            height: var(--status-height);
            background: var(--bg-dock);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            font-size: 11px;
            font-family: var(--font-code);
            color: var(--text-secondary);
        }

        .console-logs {
            flex: 1;
            padding: 8px 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-family: var(--font-code);
            font-size: 11.5px;
            background: var(--bg-canvas);
            user-select: text;
        }

        .log-row { display: flex; gap: 8px; word-break: break-all; }
        .log-row.info { color: var(--text-secondary); }
        .log-row.warn { color: var(--warning); }
        .log-row.error { color: var(--danger); }
        .log-row.system { color: var(--accent-brand); font-weight: 600; }
        .log-row.repl { color: var(--success); }

        .console-repl {
            height: 32px;
            border-top: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            background: var(--bg-dock);
            padding: 0 12px;
            gap: 8px;
        }

        .repl-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-family: var(--font-code);
            font-size: 11.5px;
        }

        .statusbar {
            height: var(--status-height);
            background: var(--bg-dock);
            border-top: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            font-size: 11px;
            font-family: var(--font-code);
            color: var(--text-tertiary);
            flex-shrink: 0;
            z-index: 40;
        }

        /* Modals & Popups */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(14px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-overlay.active { display: flex; }

        .modal-box {
            width: 100%;
            max-width: 500px;
            background: var(--bg-dock);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-lift);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }

        .modal-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
        }

        .modal-body { padding: 18px; max-height: 60vh; overflow-y: auto; }
        .modal-footer { padding: 12px 18px; border-top: 1px solid var(--glass-border); display: flex; justify-content: flex-end; }

        .project-row {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            padding: 12px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
            cursor: pointer;
        }

        .toast-container {
            position: fixed;
            bottom: 40px;
            right: 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 2000;
            pointer-events: none;
        }

        .toast {
            background: var(--bg-dock);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-float);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: var(--radius-pill);
            font-size: 12px;
            font-weight: 600;
        }

        /* ==========================================================================
           📱 SMART PHONE (MOBILE) ADAPTATION
           ========================================================================== */
        @media (max-width: 768px) {
            .site-links { display: none; }
            .save-pill { display: none; }
            .project-title-input { width: 105px; font-size: 12px; }
            .pane-divider { display: none; }
            
            .mobile-view-tabs { display: flex; }
            .mobile-code-bar { display: flex; }
            .preview-toolbar .btn-group { display: none; }

            /* On phone: single active pane logic */
            .workspace.view-mode-code .editor-pane { display: flex; flex: 1; }
            .workspace.view-mode-code .preview-pane { display: none; }
            .workspace.view-mode-code .console-drawer { display: none; }

            .workspace.view-mode-preview .editor-pane { display: none; }
            .workspace.view-mode-preview .preview-pane { display: flex; flex: 1; }
            .workspace.view-mode-preview .preview-stage { padding: 0; }
            .workspace.view-mode-preview .preview-viewport { border-radius: 0; border: none; }
            .workspace.view-mode-preview .console-drawer { display: none; }

            .workspace.view-mode-console .editor-pane { display: none; }
            .workspace.view-mode-console .preview-pane { display: flex; flex: 1; }
            .workspace.view-mode-console .preview-stage { display: none; }
            .workspace.view-mode-console .console-drawer { display: flex; flex: 1; height: 100%; border-top: none; }
            
            .sidebar {
                position: absolute;
                top: 0;
                bottom: 0;
                left: 0;
                width: 270px;
                z-index: 100;
                box-shadow: var(--shadow-lift);
            }
            .sidebar.collapsed { width: 0; }
        }
    </style>
</head>
<body>

    <!-- 1. TOP COMMAND BAR -->
    <header class="navbar-island">
        <div class="nav-cluster-left">
            <a href="index.html" class="brand-link" title="I’M AFK Hub">
                <div class="brand-gem" aria-hidden="true">★</div>
                <span>I’M AFK</span>
            </a>

            <ul class="site-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="library.html">Library</a></li>
                <li><a href="studio.html" class="active">Studio</a></li>
                <li><a href="submit.html">Submit</a></li>
                <li><a href="contact.html">Support</a></li>
            </ul>
        </div>

        <div class="nav-cluster-center">
            <input type="text" id="project-title-input" class="project-title-input" value="Web Project" spellcheck="false" title="Click to rename" aria-label="Project Title">
            
            <div class="save-pill" id="save-tag">
                <div class="save-dot" aria-hidden="true"></div>
                <span id="save-status-text">Saved</span>
            </div>

            <!-- Run Button (Works on both Phone & PC) -->
            <button class="btn btn-primary" onclick="runSandbox()" title="Run Code">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                <span>Run</span>
            </button>
        </div>

        <div class="nav-cluster-right">
            <!-- PWA Install Button (Appears on PC & Phones supporting PWA) -->
            <button class="btn btn-pwa-install" id="pwa-install-btn" onclick="installPWA()">
                <span>📲 Install</span>
            </button>

            <button class="btn" onclick="openProjectsModal()" title="Projects">
                <span>Projects</span>
            </button>

            <!-- Theme Toggle -->
            <button class="btn btn-icon" id="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Theme">
                <svg id="theme-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line></svg>
            </button>
        </div>
    </header>

    <!-- 📱 PHONE VIEWPORT SEGMENTED SWITCHER (Shown on Mobile) -->
    <div class="mobile-view-tabs" id="mobile-tabs">
        <button class="mobile-seg-btn active" id="m-tab-code" onclick="setMobileTab('code')">
            <span>📝 Code</span>
        </button>
        <button class="mobile-seg-btn" id="m-tab-preview" onclick="setMobileTab('preview')">
            <span>👁️ Preview</span>
        </button>
        <button class="mobile-seg-btn" id="m-tab-console" onclick="setMobileTab('console')">
            <span>📟 Console</span>
        </button>
    </div>

    <!-- 2. MAIN WORKSPACE (Phone + Desktop Dual Engine) -->
    <div class="workspace view-mode-code" id="workspace-container">
        
        <!-- Sidebar: Files Drawer -->
        <aside class="sidebar collapsed" id="sidebar">
            <div class="sidebar-header">
                <span>Project Files</span>
                <div>
                    <button class="btn" style="padding: 3px 8px; font-size:11px;" onclick="promptNewFile()">+ File</button>
                    <button class="btn" style="padding: 3px 8px; font-size:11px;" onclick="toggleSidebar()">✕</button>
                </div>
            </div>
            <div class="file-list" id="file-list-container"></div>
            <div style="padding: 10px; border-top: 1px solid var(--glass-border); display: flex; flex-direction: column; gap: 6px;">
                <button class="btn" style="width: 100%; font-size: 11.5px;" onclick="exportStandaloneHTML()">📥 Export .HTML</button>
                <button class="btn" style="width: 100%; font-size: 11.5px;" onclick="takeSnapshot()">💾 Take Snapshot</button>
            </div>
        </aside>

        <!-- Editor Pane -->
        <section class="editor-pane" id="editor-pane">
            <div class="tabs-bar">
                <div class="tabs-list" id="tabs-container"></div>
                <div style="display:flex; gap:4px;">
                    <button class="btn btn-icon" onclick="toggleSidebar()" title="Toggle Files">📁</button>
                    <button class="btn btn-icon" onclick="formatActiveFile()" title="Format Code">✨</button>
                </div>
            </div>

            <div class="editor-container">
                <div class="gutter" id="gutter">1</div>
                <textarea id="code-textarea" class="code-textarea" spellcheck="false" placeholder="Type HTML, CSS, or JS here..."></textarea>
            </div>

            <!-- 📱 PHONE CODING ACCESSORY KEYS (Super fast mobile typing) -->
            <div class="mobile-code-bar">
                <button class="m-key" onclick="insertKey('<')">&lt;</button>
                <button class="m-key" onclick="insertKey('>')">&gt;</button>
                <button class="m-key" onclick="insertKey('/')">/</button>
                <button class="m-key" onclick="insertKey('=')">=</button>
                <button class="m-key" onclick="insertKey('&quot;')">&quot;</button>
                <button class="m-key" onclick="insertKey('\'')">&apos;</button>
                <button class="m-key" onclick="insertKey('{')">{</button>
                <button class="m-key" onclick="insertKey('}')">}</button>
                <button class="m-key" onclick="insertKey('(')">(</button>
                <button class="m-key" onclick="insertKey(')')">)</button>
                <button class="m-key" onclick="insertKey(';')">;</button>
                <button class="m-key" onclick="insertKey(':')">:</button>
                <button class="m-key" onclick="insertKey('.')">.</button>
            </div>
        </section>

        <!-- Resizable Split Divider (Active on Desktop) -->
        <div class="pane-divider" id="pane-divider" title="Drag to resize"></div>

        <!-- Preview Stage & Console Pane -->
        <section class="preview-pane" id="preview-pane">
            <div class="preview-toolbar">
                <div class="btn-group">
                    <button class="btn active" id="view-full" onclick="setPreviewViewport('100%', '100%', this)">Full</button>
                    <button class="btn" id="view-tablet" onclick="setPreviewViewport('768px', '100%', this)">Tablet</button>
                    <button class="btn" id="view-mobile" onclick="setPreviewViewport('375px', '667px', this)">Mobile</button>
                </div>

                <div style="display:flex; gap:6px;">
                    <button class="btn" onclick="runSandbox()" title="Reload preview">↻ Refresh</button>
                    <button class="btn" onclick="openPreviewNewTab()" title="Open preview in new tab">↗ Popout</button>
                </div>
            </div>

            <div class="preview-stage">
                <div class="preview-viewport" id="preview-viewport">
                    <iframe id="sandbox-frame" sandbox="allow-scripts allow-forms allow-modals allow-same-origin allow-popups" allow="fullscreen; autoplay; gamepad"></iframe>
                </div>
            </div>

            <!-- Debug Console -->
            <div class="console-drawer" id="console-drawer">
                <div class="console-header">
                    <span>Console (<span id="console-counter">0</span>)</span>
                    <button class="btn" style="padding:2px 8px; font-size:10.5px;" onclick="clearConsole()">Clear</button>
                </div>

                <div class="console-logs" id="console-logs">
                    <div class="log-row system">✦ Studio Web App loaded. Ready for Computer & Phone.</div>
                </div>

                <div class="console-repl">
                    <span style="color:var(--accent-brand); font-family:var(--font-code);">❯</span>
                    <input type="text" id="repl-input" class="repl-input" placeholder="Eval JS..." onkeydown="handleReplKey(event)">
                </div>
            </div>
        </section>
    </div>

    <!-- 3. STATUS BAR -->
    <footer class="statusbar">
        <div class="statusbar-item">
            <span id="status-cursor">Ln 1, Col 1</span>
        </div>
        <div class="statusbar-item">
            <span id="status-file-info">0 lines</span>
            <span>•</span>
            <span id="status-mode" style="color:var(--accent-brand);">PWA Ready</span>
        </div>
    </footer>

    <!-- Projects Modal -->
    <div class="modal-overlay" id="projects-modal">
        <div class="modal-box">
            <div class="modal-header">
                <span>Manage Projects</span>
                <button class="btn btn-icon" onclick="closeProjectsModal()">✕</button>
            </div>
            <div class="modal-body">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                    <span style="color:var(--text-secondary); font-size:12px;">Stored offline on this device.</span>
                    <button class="btn btn-primary" onclick="createNewProjectPrompt()">+ New</button>
                </div>
                <div id="projects-list"></div>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeProjectsModal()">Close</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <!-- ==========================================================================
         APPLICATION SCRIPTS (100% GITHUB PAGES, DESKTOP & MOBILE COMPATIBLE)
         ========================================================================== -->
    <script>
        const STORAGE_PROJECTS = 'afk_studio_projects_v3';
        const STORAGE_ACTIVE_ID = 'afk_studio_active_id_v3';

        const codeTextarea = document.getElementById('code-textarea');
        const gutter = document.getElementById('gutter');
        const projectTitleInput = document.getElementById('project-title-input');
        const saveTag = document.getElementById('save-tag');
        const saveStatusText = document.getElementById('save-status-text');
        const fileListContainer = document.getElementById('file-list-container');
        const tabsContainer = document.getElementById('tabs-container');
        const sandboxFrame = document.getElementById('sandbox-frame');
        const consoleLogs = document.getElementById('console-logs');
        const consoleCounter = document.getElementById('console-counter');
        const replInput = document.getElementById('repl-input');
        const previewViewport = document.getElementById('preview-viewport');
        const statusCursor = document.getElementById('status-cursor');
        const statusFileInfo = document.getElementById('status-file-info');
        const workspaceContainer = document.getElementById('workspace-container');

        let activeProjectId = null;
        let activeFilePath = "index.html";
        let openTabs = ["index.html"];
        let autoSaveTimer = null;
        let consoleLogCount = 0;

        /* PWA Install Handler (Android, Chrome, Edge, PC) */
        let deferredPrompt = null;
        const pwaBtn = document.getElementById('pwa-install-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            if (pwaBtn) pwaBtn.style.display = 'inline-flex';
        });

        async function installPWA() {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                pwaBtn.style.display = 'none';
                showToast("Studio installed to your device!");
            }
            deferredPrompt = null;
        }

        /* 📱 Mobile View Switcher: Code / Preview / Console */
        function setMobileTab(mode) {
            document.querySelectorAll('.mobile-seg-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`m-tab-${mode}`).classList.add('active');

            workspaceContainer.classList.remove('view-mode-code', 'view-mode-preview', 'view-mode-console');
            workspaceContainer.classList.add(`view-mode-${mode}`);

            if (mode === 'preview') {
                runSandbox(true);
            }
        }

        /* 📱 Mobile Quick-Code Key Inserter */
        function insertKey(char) {
            const start = codeTextarea.selectionStart;
            const end = codeTextarea.selectionEnd;
            const val = codeTextarea.value;

            codeTextarea.value = val.substring(0, start) + char + val.substring(end);
            codeTextarea.selectionStart = codeTextarea.selectionEnd = start + char.length;
            codeTextarea.focus();
            updateMetrics();
            triggerChange();
        }

        /* State Initialization */
        function initStudio() {
            let manifest = JSON.parse(localStorage.getItem(STORAGE_PROJECTS) || 'null');
            if (!manifest || manifest.length === 0) {
                const defaultProject = {
                    id: 'proj_' + Date.now(),
                    title: "Web App",
                    files: [
                        {
                            name: "index.html",
                            path: "index.html",
                            type: "html",
                            content: '<!DOCTYPE html>\n<html>\n<head>\n  <meta charset="utf-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1.0">\n  <title>App</title>\n  <link rel="stylesheet" href="style.css">\n</head>\n<body>\n  <div class="card">\n    <h1>I’M AFK Web Studio</h1>\n    <p>Works on Desktop and Phones!</p>\n    <button id="btn">Clicks: 0</button>\n  </div>\n  <script src="app.js">' + '<' + '/script>\n</body>\n</html>'
                        },
                        {
                            name: "style.css",
                            path: "style.css",
                            type: "css",
                            content: 'body { margin:0; background:#050807; color:#F2F8F5; font-family:sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; }\n.card { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); padding:28px; border-radius:20px; text-align:center; max-width:85%; }\nbutton { background:#38E1A6; border:none; color:#050807; padding:12px 24px; border-radius:999px; font-weight:700; font-size:15px; margin-top:14px; cursor:pointer; }'
                        },
                        {
                            name: "app.js",
                            path: "app.js",
                            type: "js",
                            content: 'let count = 0;\ndocument.getElementById("btn").onclick = () => {\n  count++;\n  document.getElementById("btn").innerText = "Clicks: " + count;\n  console.log("Count: " + count);\n};\nconsole.log("Studio App ready.");'
                        }
                    ],
                    updatedAt: Date.now(),
                    snapshots: []
                };
                manifest = [defaultProject];
                localStorage.setItem(STORAGE_PROJECTS, JSON.stringify(manifest));
                localStorage.setItem(STORAGE_ACTIVE_ID, defaultProject.id);
            }

            activeProjectId = localStorage.getItem(STORAGE_ACTIVE_ID) || manifest[0].id;
            const project = manifest.find(p => p.id === activeProjectId) || manifest[0];
            activeProjectId = project.id;

            loadProjectState(project);
            runSandbox(true);
        }

        function getActiveProject() {
            const manifest = JSON.parse(localStorage.getItem(STORAGE_PROJECTS) || '[]');
            return manifest.find(p => p.id === activeProjectId) || manifest[0];
        }

        function loadProjectState(project) {
            projectTitleInput.value = project.title;
            if (!project.files.some(f => f.path === activeFilePath)) {
                activeFilePath = project.files[0] ? project.files[0].path : "";
            }
            if (!openTabs.includes(activeFilePath) && activeFilePath) {
                openTabs = [activeFilePath];
            }
            renderFileList();
            renderTabs();
            loadActiveFileContent();
        }

        function saveActiveProject(silent = false) {
            const manifest = JSON.parse(localStorage.getItem(STORAGE_PROJECTS) || '[]');
            const idx = manifest.findIndex(p => p.id === activeProjectId);
            if (idx === -1) return;

            const file = manifest[idx].files.find(f => f.path === activeFilePath);
            if (file) file.content = codeTextarea.value;

            manifest[idx].title = projectTitleInput.value.trim() || 'Untitled';
            manifest[idx].updatedAt = Date.now();

            localStorage.setItem(STORAGE_PROJECTS, JSON.stringify(manifest));
            saveTag.classList.remove('unsaved');
            saveStatusText.textContent = 'Saved';

            if (!silent) showToast('Saved');
        }

        function triggerChange() {
            saveTag.classList.add('unsaved');
            saveStatusText.textContent = 'Unsaved';
            clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(() => saveActiveProject(true), 600);
        }

        function renderFileList() {
            const project = getActiveProject();
            if (!project) return;

            fileListContainer.innerHTML = '';
            project.files.forEach(file => {
                const item = document.createElement('div');
                item.className = `file-item ${file.path === activeFilePath ? 'active' : ''}`;
                item.innerHTML = `
                    <div class="file-item-title" onclick="switchActiveFile('${file.path}')">
                        <span class="file-icon">${file.type === 'html' ? '&lt;&gt;' : (file.type === 'css' ? '#' : (file.type === 'js' ? 'JS' : '•'))}</span>
                        <span>${file.name}</span>
                    </div>
                    <div>
                        ${project.files.length > 1 ? `<button class="btn" style="padding:2px 6px; font-size:10px;" onclick="deleteFile('${file.path}', event)">✕</button>` : ''}
                    </div>
                `;
                fileListContainer.appendChild(item);
            });
        }

        function renderTabs() {
            tabsContainer.innerHTML = '';
            openTabs.forEach(path => {
                const file = getActiveProject().files.find(f => f.path === path);
                if (!file) return;

                const tab = document.createElement('button');
                tab.className = `tab ${path === activeFilePath ? 'active' : ''}`;
                tab.onclick = () => switchActiveFile(path);
                tab.innerHTML = `<span>${file.name}</span><span class="tab-close" onclick="closeTab('${path}', event)">✕</span>`;
                tabsContainer.appendChild(tab);
            });
        }

        function switchActiveFile(path) {
            const project = getActiveProject();
            const curFile = project.files.find(f => f.path === activeFilePath);
            if (curFile) curFile.content = codeTextarea.value;

            activeFilePath = path;
            if (!openTabs.includes(path)) openTabs.push(path);

            renderFileList();
            renderTabs();
            loadActiveFileContent();
            
            // Auto close mobile drawer if open
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.add('collapsed');
            }
        }

        function closeTab(path, e) {
            if (e) e.stopPropagation();
            openTabs = openTabs.filter(p => p !== path);
            if (activeFilePath === path) {
                activeFilePath = openTabs.length > 0 ? openTabs[openTabs.length - 1] : "";
            }
            renderTabs();
            renderFileList();
            loadActiveFileContent();
        }

        function loadActiveFileContent() {
            const project = getActiveProject();
            const file = project.files.find(f => f.path === activeFilePath);
            if (file) {
                codeTextarea.value = file.content;
                codeTextarea.disabled = false;
            } else {
                codeTextarea.value = '';
                codeTextarea.disabled = true;
            }
            updateMetrics();
        }

        function promptNewFile() {
            const name = prompt("File name (e.g. style.css, script.js):");
            if (!name || !name.trim()) return;

            const cleanName = name.trim();
            const ext = cleanName.split('.').pop().toLowerCase();
            const project = getActiveProject();

            project.files.push({ name: cleanName, path: cleanName, type: ext, content: '' });
            saveActiveProject(true);
            switchActiveFile(cleanName);
        }

        function deleteFile(path, e) {
            if (e) e.stopPropagation();
            if (!confirm(`Delete ${path}?`)) return;

            const project = getActiveProject();
            project.files = project.files.filter(f => f.path !== path);
            openTabs = openTabs.filter(t => t !== path);
            activeFilePath = project.files[0] ? project.files[0].path : "";

            saveActiveProject(true);
            renderFileList();
            renderTabs();
            loadActiveFileContent();
        }

        function updateMetrics() {
            requestAnimationFrame(() => {
                const text = codeTextarea.value;
                const lines = text.split('\n').length;
                gutter.innerHTML = Array.from({ length: lines }, (_, i) => i + 1).join('<br>');
                statusFileInfo.textContent = `${lines} lines`;
            });
        }

        codeTextarea.addEventListener('input', () => { updateMetrics(); triggerChange(); });
        codeTextarea.addEventListener('scroll', () => { gutter.scrollTop = codeTextarea.scrollTop; });
        codeTextarea.addEventListener('click', updateCursorPos);
        codeTextarea.addEventListener('keyup', updateCursorPos);

        function updateCursorPos() {
            const pos = codeTextarea.selectionStart;
            const lines = codeTextarea.value.substring(0, pos).split('\n');
            statusCursor.textContent = `Ln ${lines.length}, Col ${lines[lines.length - 1].length + 1}`;
        }

        // Keyboard Shortcuts (Desktop)
        window.addEventListener('keydown', (e) => {
            const isCmd = e.ctrlKey || e.metaKey;

            if (isCmd && (e.key === 's' || e.key === 'S')) {
                e.preventDefault();
                saveActiveProject();
                return;
            }

            if (isCmd && e.key === 'Enter') {
                e.preventDefault();
                runSandbox();
                return;
            }
        });

        // Tab indent support
        codeTextarea.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = codeTextarea.selectionStart;
                const end = codeTextarea.selectionEnd;
                codeTextarea.value = codeTextarea.value.substring(0, start) + "  " + codeTextarea.value.substring(end);
                codeTextarea.selectionStart = codeTextarea.selectionEnd = start + 2;
                updateMetrics();
                triggerChange();
            }
        });

        projectTitleInput.addEventListener('input', triggerChange);

        function formatActiveFile() {
            const lines = codeTextarea.value.split('\n');
            let indent = 0;
            const formatted = lines.map(line => {
                const t = line.trim();
                if (t.startsWith('</') || t.startsWith('}') || t.startsWith(']')) indent = Math.max(0, indent - 1);
                const out = '  '.repeat(indent) + t;
                if ((t.endsWith('{') || (t.startsWith('<') && !t.startsWith('</') && !t.endsWith('/>') && !t.includes('</'))) && !t.startsWith('<!')) indent++;
                return out;
            }).join('\n');

            codeTextarea.value = formatted;
            updateMetrics();
            triggerChange();
            showToast('Formatted');
        }

        /* --------------------------------------------------------------------------
           SANDBOX RUNNER (Works 100% on Phone & PC)
           -------------------------------------------------------------------------- */
        function runSandbox(silent = false) {
            saveActiveProject(true);
            const project = getActiveProject();
            if (!project) return;

            const htmlFile = project.files.find(f => f.path.endsWith('.html')) || project.files[0];
            if (!htmlFile) return;

            let bundle = htmlFile.content;

            project.files.filter(f => f.type === 'css').forEach(css => {
                bundle = bundle.replace('</head>', '<style>/* ' + css.name + ' */\n' + css.content + '\n</style></head>');
            });

            project.files.filter(f => f.type === 'js').forEach(js => {
                bundle = bundle.replace('</body>', '<script>/* ' + js.name + ' */\n' + js.content + '\n<' + '/script></body>');
            });

            const bridge = '<script>' +
                '(function(){' +
                '  const _log = console.log, _warn = console.warn, _err = console.error;' +
                '  console.log = (...args) => { _log(...args); window.parent.postMessage({ type: "CONSOLE_LOG", level: "info", text: args.join(" ") }, "*"); };' +
                '  console.warn = (...args) => { _warn(...args); window.parent.postMessage({ type: "CONSOLE_LOG", level: "warn", text: args.join(" ") }, "*"); };' +
                '  console.error = (...args) => { _err(...args); window.parent.postMessage({ type: "CONSOLE_LOG", level: "error", text: args.join(" ") }, "*"); };' +
                '})();' +
                '<' + '/script>';

            bundle = bundle.includes('<head>') ? bundle.replace('<head>', '<head>' + bridge) : bridge + bundle;

            // Direct assignment to srcdoc guarantees 100% reliability
            sandboxFrame.srcdoc = bundle;

            if (!silent) {
                appendConsoleLog('App executed.', 'system');
                showToast('Ran code');
            }
        }

        window.addEventListener('message', (e) => {
            if (e.data && e.data.type === 'CONSOLE_LOG') appendConsoleLog(e.data.text, e.data.level);
        });

        function appendConsoleLog(text, level = 'info') {
            consoleLogCount++;
            consoleCounter.textContent = consoleLogCount;
            const row = document.createElement('div');
            row.className = `log-row ${level}`;
            row.textContent = `❯ ${text}`;
            consoleLogs.appendChild(row);
            consoleLogs.scrollTop = consoleLogs.scrollHeight;
        }

        function clearConsole() {
            consoleLogs.innerHTML = '';
            consoleLogCount = 0;
            consoleCounter.textContent = '0';
        }

        function handleReplKey(e) {
            if (e.key === 'Enter') {
                const cmd = replInput.value.trim();
                if (!cmd) return;
                appendConsoleLog(cmd, 'repl');
                try { sandboxFrame.contentWindow.eval(cmd); }
                catch(err) { appendConsoleLog(err.message, 'error'); }
                replInput.value = '';
            }
        }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); }

        function setPreviewViewport(w, h, btn) {
            document.querySelectorAll('.preview-toolbar .btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            previewViewport.style.width = w;
            previewViewport.style.height = h;
        }

        function openPreviewNewTab() {
            const project = getActiveProject();
            const htmlFile = project.files.find(f => f.path.endsWith('.html')) || project.files[0];
            if (!htmlFile) return;
            const win = window.open();
            win.document.write(htmlFile.content);
            win.document.close();
        }

        function exportStandaloneHTML() {
            const project = getActiveProject();
            const htmlFile = project.files.find(f => f.path.endsWith('.html')) || project.files[0];
            if (!htmlFile) return;

            let bundle = htmlFile.content;
            project.files.filter(f => f.type === 'css').forEach(css => bundle = bundle.replace('</head>', `<style>\n${css.content}\n</style></head>`));
            project.files.filter(f => f.type === 'js').forEach(js => bundle = bundle.replace('</body>', `<script>\n${js.content}\n<` + `/script></body>`));

            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([bundle], { type: 'text/html' }));
            a.download = `${project.title.toLowerCase().replace(/\s+/g, '_')}.html`;
            a.click();
            showToast('Exported Standalone HTML');
        }

        function takeSnapshot() {
            const project = getActiveProject();
            if (!project.snapshots) project.snapshots = [];
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            project.snapshots.unshift({ id: 'snap_' + Date.now(), label: `Snapshot at ${time}`, files: JSON.parse(JSON.stringify(project.files)) });
            if (project.snapshots.length > 6) project.snapshots.pop();
            saveActiveProject(true);
            showToast("Snapshot saved");
        }

        function openProjectsModal() { renderProjectsList(); document.getElementById('projects-modal').classList.add('active'); }
        function closeProjectsModal() { document.getElementById('projects-modal').classList.remove('active'); }

        function renderProjectsList() {
            const container = document.getElementById('projects-list');
            const manifest = JSON.parse(localStorage.getItem(STORAGE_PROJECTS) || '[]');
            container.innerHTML = manifest.map(p => `
                <div class="project-row" onclick="switchProject('${p.id}')">
                    <div>
                        <div style="font-weight:700; font-size:13px;">${p.title}</div>
                        <div style="font-size:11px; color:var(--text-tertiary);">${p.files.length} files</div>
                    </div>
                    <button class="btn" style="padding:2px 6px; font-size:10px;" onclick="event.stopPropagation(); deleteProject('${p.id}')">✕</button>
                </div>
            `).join('');
        }

        function createNewProjectPrompt() {
            const title = prompt("Project Name:", "New Project");
            if (!title) return;
            const manifest = JSON.parse(localStorage.getItem(STORAGE_PROJECTS) || '[]');
            const newProj = {
                id: 'proj_' + Date.now(),
                title: title.trim(),
                files: [{ name: "index.html", path: "index.html", type: "html", content: "<h1>New Project</h1>" }],
                updatedAt: Date.now(),
                snapshots: []
            };
            manifest.unshift(newProj);
            localStorage.setItem(STORAGE_PROJECTS, JSON.stringify(manifest));
            switchProject(newProj.id);
            closeProjectsModal();
        }

        function deleteProject(id) {
            if (!confirm("Delete project?")) return;
            let manifest = JSON.parse(localStorage.getItem(STORAGE_PROJECTS) || '[]');
            manifest = manifest.filter(p => p.id !== id);
            localStorage.setItem(STORAGE_PROJECTS, JSON.stringify(manifest));
            if (activeProjectId === id && manifest.length > 0) switchProject(manifest[0].id);
            renderProjectsList();
        }

        function switchProject(id) {
            activeProjectId = id;
            localStorage.setItem(STORAGE_ACTIVE_ID, id);
            loadProjectState(getActiveProject());
            runSandbox(true);
            closeProjectsModal();
        }

        function toggleTheme() {
            const cur = document.documentElement.getAttribute('data-theme') || 'dark';
            const next = cur === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('afk_theme', next);
            showToast(`Theme: ${next}`);
        }

        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        /* Desktop Drag Divider */
        const paneDivider = document.getElementById('pane-divider');
        const editorPane = document.getElementById('editor-pane');
        let isResizing = false;

        paneDivider.addEventListener('mousedown', () => { isResizing = true; });
        window.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            const bounds = workspaceContainer.getBoundingClientRect();
            const pct = ((e.clientX - bounds.left) / bounds.width) * 100;
            if (pct > 20 && pct < 80) editorPane.style.flex = `0 0 ${pct}%`;
        });
        window.addEventListener('mouseup', () => { isResizing = false; });

        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('afk_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            initStudio();
        });
    </script>
</body>
</html>
