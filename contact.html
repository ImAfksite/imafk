<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="meta.title">Contact & Support — I’m Afk</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-deep: #0a0a12;
            --glass-card: rgba(16, 22, 36, 0.72);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-ice: #67e8f9;
            --font-display: 'Space Grotesk', sans-serif;
            --font-main: 'Plus Jakarta Sans', system-ui, sans-serif;
        }

        html[lang="ar"] { --font-main: 'Tajawal', system-ui, sans-serif; }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-deep);
            background-image: radial-gradient(circle at 50% 20%, rgba(45, 111, 212, 0.18) 0%, transparent 60%),
                              radial-gradient(circle at 80% 80%, rgba(91, 140, 219, 0.12) 0%, transparent 50%);
            color: var(--text-main);
            font-family: var(--font-main);
            min-height: 100vh;
            line-height: 1.6;
        }

        .glass-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px clamp(24px, 4vw, 48px);
            background: rgba(10, 10, 18, 0.6);
            backdrop-filter: blur(25px);
            border-bottom: 1px solid var(--glass-border);
        }

        .brand-block {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-main);
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .nav-back-btn, .lang-toggle {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 7px 18px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.8rem;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .nav-back-btn:hover, .lang-toggle:hover {
            background: rgba(255, 255, 255, 0.16);
            border-color: var(--accent-ice);
            color: #fff;
        }

        .contact-container {
            max-width: 760px;
            margin: 50px auto 80px;
            padding: 0 24px;
        }

        .contact-header {
            text-align: center;
            margin-bottom: 36px;
        }

        .contact-header h1 {
            font-family: var(--font-display);
            font-size: clamp(2.2rem, 4vw, 3.2rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        .contact-header p {
            color: var(--text-muted);
            font-size: 1rem;
            max-width: 480px;
            margin: 0 auto;
        }

        .glass-form-card {
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 40px;
            backdrop-filter: blur(25px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }
        .full-width { grid-column: 1 / -1; }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: 700;
            color: #d1d5db;
        }

        .input-group input,
        .input-group select,
        .input-group textarea {
            width: 100%;
            background: rgba(9, 13, 22, 0.8);
            border: 1px solid var(--glass-border);
            padding: 14px 18px;
            border-radius: 14px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            font-family: inherit;
            transition: all 0.3s;
        }

        .input-group select option {
            background: #090d16;
            color: #fff;
        }

        .input-group input:focus,
        .input-group select:focus,
        .input-group textarea:focus {
            border-color: var(--accent-ice);
            box-shadow: 0 0 20px rgba(103, 232, 249, 0.2);
            background: rgba(12, 18, 30, 0.95);
        }

        .submit-btn-main {
            width: 100%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            padding: 16px;
            border-radius: 50px;
            font-family: var(--font-display);
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.25s ease;
        }

        .submit-btn-main:hover {
            background: rgba(255, 255, 255, 0.95);
            color: #0a0a12;
            transform: translateY(-2px);
        }

        footer {
            border-top: 1px solid var(--glass-border);
            padding: 40px 24px;
            text-align: center;
            background: rgba(10, 10, 18, 0.85);
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header class="glass-nav">
        <a href="index.html" class="brand-block">
            <span>✦</span>
            <span>I’M AFK</span>
        </a>
        <div style="display: flex; gap: 12px;">
            <a href="index.html" class="nav-back-btn" data-i18n="nav.back">← Return to Hub</a>
            <button type="button" class="lang-toggle" id="lang-btn">العربية</button>
        </div>
    </header>

    <main class="contact-container">
        <div class="contact-header">
            <h1 data-i18n="contact.title">Contact & <span>Support</span></h1>
            <p data-i18n="contact.lead">Have feedback, a bug report, or a copyright inquiry? Send a direct dispatch to our team.</p>
        </div>

        <div class="glass-form-card">
            <form action="https://formspree.io/f/mjybeepe" method="POST" id="contactForm">
                <div class="form-grid">
                    <div class="input-group full-width">
                        <label for="category" data-i18n="form.category">Reason for Inquiry *</label>
                        <select name="Category" id="category" required>
                            <option value="General Contact" data-i18n="opt.general">General Feedback / Inquiry</option>
                            <option value="Report Issue" data-i18n="opt.bug">Report Broken Game / Bug</option>
                            <option value="Copyright/DMCA" data-i18n="opt.dmca">Copyright / DMCA Takedown Notice</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="name" data-i18n="form.name">Your Name *</label>
                        <input type="text" name="name" id="name" placeholder="Alex Morgan" required>
                    </div>

                    <div class="input-group">
                        <label for="email" data-i18n="form.email">Your Email Address *</label>
                        <input type="email" name="email" id="email" placeholder="alex@domain.com" required>
                    </div>

                    <div class="input-group full-width">
                        <label for="message" data-i18n="form.message">Message / Details *</label>
                        <textarea name="message" id="message" style="min-height: 140px;" placeholder="Please describe the issue or game title clearly..." required></textarea>
                    </div>
                </div>

                <input type="text" name="_gotcha" style="display:none">

                <button type="submit" class="submit-btn-main" data-i18n="form.submit">Send Message →</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2024–2026 I’m Afk &bull; Support Desk</p>
    </footer>

    <script>
        const I18N = {
            en: {
                "meta.title": "Contact & Support — I’m Afk",
                "nav.back": "← Return to Hub",
                "contact.title": "Contact & <span>Support</span>",
                "contact.lead": "Have feedback, a bug report, or a copyright inquiry? Send a direct dispatch to our team.",
                "form.category": "Reason for Inquiry *",
                "opt.general": "General Feedback / Inquiry",
                "opt.bug": "Report Broken Game / Bug",
                "opt.dmca": "Copyright / DMCA Takedown Notice",
                "form.name": "Your Name *",
                "form.email": "Your Email Address *",
                "form.message": "Message / Details *",
                "form.submit": "Send Message →"
            },
            ar: {
                "meta.title": "مركز الدعم والتواصل — I’m Afk",
                "nav.back": "← العودة إلى الرئيسية",
                "contact.title": "الدعم <span>والتواصل</span>",
                "contact.lead": "هل لديك اقتراح، إبلاغ عن مشكلة برمجية، أو إشعار بخصوص حقوق النشر؟ أرسل رسالتك مباشرة لفريق المنصة.",
                "form.category": "سبب التواصل *",
                "opt.general": "استفسار عام / اقتراح",
                "opt.bug": "الإبلاغ عن لعبة لا تعمل",
                "opt.dmca": "إشعار حقوق النشر / DMCA",
                "form.name": "الاسم *",
                "form.email": "البريد الإلكتروني *",
                "form.message": "تفاصيل الرسالة *",
                "form.submit": "إرسال الرسالة ←"
            }
        };

        let currentLang = 'en';
        const langBtn = document.getElementById('lang-btn');

        function setLanguage(lang) {
            currentLang = lang;
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            langBtn.textContent = lang === 'en' ? 'العربية' : 'English';
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (I18N[lang][key]) el.innerHTML = I18N[lang][key];
            });
        }
        langBtn.addEventListener('click', () => setLanguage(currentLang === 'en' ? 'ar' : 'en'));
    </script>
</body>
</html>
