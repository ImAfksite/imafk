<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="meta.title">Contact & Support — I’M AFK</title>
    
    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================================
           DESIGN SYSTEM: ADDITION7-INSPIRED CLEAN ARCHITECTURE
           ========================================================================== */
        :root {
            --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-display: 'Space Grotesk', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            
            --nav-height: 52px;
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-pill: 9999px;

            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
            --transition-fast: 0.15s var(--ease-out);
        }

        html[lang="ar"] { 
            --font-ui: 'Tajawal', system-ui, sans-serif; 
            --font-display: 'Tajawal', sans-serif;
        }

        /* DARK THEME (Default) */
        [data-theme="dark"] {
            --bg-canvas: #090a0d;
            --bg-surface: #111318;
            --bg-panel: #16181f;
            --bg-elevated: #1d202a;
            --bg-input: #101217;
            --bg-hover: rgba(255, 255, 255, 0.04);
            --bg-active: #232734;

            --border: rgba(255, 255, 255, 0.09);
            --border-subtle: rgba(255, 255, 255, 0.05);
            --border-strong: rgba(255, 255, 255, 0.16);
            --border-focus: #3b82f6;

            --text-main: #f3f4f6;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --text-dim: #4b5563;

            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --accent-subtle: rgba(59, 130, 246, 0.12);
            --accent-text: #60a5fa;

            --success: #10b981;
            --success-subtle: rgba(16, 185, 129, 0.12);
            --warning: #f59e0b;
            --danger: #ef4444;

            --shadow-pop: 0 10px 30px -5px rgba(0, 0, 0, 0.6);
            --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.3);
        }

        /* LIGHT THEME */
        [data-theme="light"] {
            --bg-canvas: #f8fafc;
            --bg-surface: #ffffff;
            --bg-panel: #f1f5f9;
            --bg-elevated: #e2e8f0;
            --bg-input: #ffffff;
            --bg-hover: rgba(0, 0, 0, 0.04);
            --bg-active: #e2e8f0;

            --border: rgba(0, 0, 0, 0.09);
            --border-subtle: rgba(0, 0, 0, 0.05);
            --border-strong: rgba(0, 0, 0, 0.18);
            --border-focus: #2563eb;

            --text-main: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --text-dim: #94a3b8;

            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-subtle: rgba(37, 99, 235, 0.08);
            --accent-text: #2563eb;

            --success: #059669;
            --success-subtle: rgba(5, 150, 105, 0.08);
            --warning: #d97706;
            --danger: #dc2626;

            --shadow-pop: 0 10px 30px -5px rgba(0, 0, 0, 0.12);
            --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.05);
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-canvas);
            color: var(--text-main);
            font-family: var(--font-ui);
            font-size: 13px;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* ==========================================================================
           TOP NAVIGATION
           ========================================================================== */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            height: var(--nav-height);
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 clamp(16px, 3vw, 32px);
            flex-shrink: 0;
        }

        .brand-link {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 700;
            font-family: var(--font-display);
            font-size: 0.95rem;
            letter-spacing: -0.3px;
        }
        .brand-badge {
            width: 22px;
            height: 22px;
            background: var(--text-main);
            color: var(--bg-surface);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 800;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 20px;
            align-items: center;
        }
        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 12px;
            font-weight: 500;
            transition: var(--transition-fast);
        }
        .nav-links a:hover, .nav-links a.active {
            color: var(--text-main);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Buttons */
        .btn {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            font-family: var(--font-ui);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            transition: var(--transition-fast);
            white-space: nowrap;
        }
        .btn:hover {
            background: var(--bg-elevated);
            border-color: var(--border-strong);
            color: var(--text-main);
        }
        .btn:active {
            transform: translateY(1px);
        }
        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #ffffff;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
            color: #ffffff;
        }
        .btn-icon {
            padding: 6px 8px;
        }

        /* ==========================================================================
           MAIN CONTENT & CONTACT FORM
           ========================================================================== */
        .page-container {
            max-width: 680px;
            width: 100%;
            margin: 32px auto 60px;
            padding: 0 clamp(16px, 3vw, 24px);
        }

        .page-header {
            margin-bottom: 24px;
        }
        .page-title {
            font-family: var(--font-display);
            font-size: clamp(1.5rem, 3vw, 2rem);
            font-weight: 700;
            letter-spacing: -0.6px;
            color: var(--text-main);
            margin-bottom: 6px;
        }
        .page-desc {
            color: var(--text-secondary);
            font-size: 13px;
        }

        /* Form Card */
        .form-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 24px;
            box-shadow: var(--shadow-card);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }
        .full-width { grid-column: 1 / -1; }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .input-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            padding: 8px 10px;
            border-radius: var(--radius-sm);
            color: var(--text-main);
            font-family: var(--font-ui);
            font-size: 12px;
            outline: none;
            transition: var(--transition-fast);
        }
        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            border-color: var(--border-focus);
        }

        .form-select {
            cursor: pointer;
        }
        .form-select option {
            background: var(--bg-surface);
            color: var(--text-main);
        }

        .form-textarea {
            min-height: 130px;
            resize: vertical;
            line-height: 1.5;
        }

        /* ==========================================================================
           FOOTER
           ========================================================================== */
        .footer {
            border-top: 1px solid var(--border);
            padding: 24px clamp(16px, 3vw, 32px);
            background: var(--bg-surface);
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 11px;
            margin-top: auto;
        }

        @media (max-width: 640px) {
            .navbar { padding: 0 12px; }
            .nav-links { display: none; }
            .form-grid { grid-template-columns: 1fr; }
            .footer { flex-direction: column; gap: 8px; text-align: center; }
        }
    </style>
</head>
<body>

    <!-- Top Navigation -->
    <header class="navbar">
        <a href="index.html" class="brand-link" title="I’M AFK Hub">
            <div class="brand-badge">✦</div>
            <span>I’M AFK <span style="font-size:11px; color:var(--text-muted); font-weight:500;">Support</span></span>
        </a>

        <ul class="nav-links">
            <li><a href="index.html" data-i18n="nav.home">Home</a></li>
            <li><a href="library.html" data-i18n="nav.library">Library</a></li>
            <li><a href="studio.html" data-i18n="nav.studio">Studio</a></li>
            <li><a href="submit.html" data-i18n="nav.submit">Submit</a></li>
            <li><a href="contact.html" class="active" data-i18n="nav.support">Support</a></li>
        </ul>

        <div class="nav-actions">
            <a href="index.html" class="btn" data-i18n="nav.back">← Return to Hub</a>
            <button type="button" class="btn" id="lang-btn">العربية</button>
            <button type="button" class="btn btn-icon" id="theme-btn" onclick="toggleTheme()" title="Switch Theme">◐</button>
        </div>
    </header>

    <!-- Support Form Container -->
    <main class="page-container">
        
        <div class="page-header">
            <h1 class="page-title" data-i18n="contact.title">Contact & Support</h1>
            <p class="page-desc" data-i18n="contact.lead">Have feedback, a bug report, or a copyright inquiry? Send a direct dispatch to our team.</p>
        </div>

        <!-- Contact Form Card -->
        <div class="form-card">
            <form action="https://formspree.io/f/mjybeepe" method="POST" id="contactForm">
                <div class="form-grid">
                    
                    <div class="input-group full-width">
                        <label class="input-label" for="category" data-i18n="form.category">Reason for Inquiry *</label>
                        <select name="Category" id="category" class="form-select" required>
                            <option value="General Contact" data-i18n="opt.general">General Feedback / Inquiry</option>
                            <option value="Report Issue" data-i18n="opt.bug">Report Broken Project / Bug</option>
                            <option value="Copyright/DMCA" data-i18n="opt.dmca">Copyright / DMCA Takedown Notice</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="name" data-i18n="form.name">Your Name *</label>
                        <input type="text" name="name" id="name" class="form-input" placeholder="Alex Morgan" required>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="email" data-i18n="form.email">Your Email Address *</label>
                        <input type="email" name="email" id="email" class="form-input" placeholder="alex@domain.com" required>
                    </div>

                    <div class="input-group full-width">
                        <label class="input-label" for="message" data-i18n="form.message">Message / Details *</label>
                        <textarea name="message" id="message" class="form-textarea" placeholder="Please describe the issue or project details clearly..." required></textarea>
                    </div>

                </div>

                <input type="text" name="_gotcha" style="display:none">

                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 9px;">
                    <span data-i18n="form.submit">Send Message ➔</span>
                </button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <span>&copy; 2026 I’M AFK &bull; Support Desk</span>
        <span style="font-family: var(--font-mono);">Addition7 Precision Standard</span>
    </footer>

    <!-- ==========================================================================
         CORE JAVASCRIPT
         ========================================================================== -->
    <script>
        /* -------------------------------------------------------------
           1. INTERNATIONALIZATION (EN & AR)
        ------------------------------------------------------------- */
        const I18N = {
            en: {
                "meta.title": "Contact & Support — I’M AFK",
                "nav.home": "Home",
                "nav.library": "Library",
                "nav.studio": "Studio",
                "nav.submit": "Submit",
                "nav.support": "Support",
                "nav.back": "← Return to Hub",
                "contact.title": "Contact & Support",
                "contact.lead": "Have feedback, a bug report, or a copyright inquiry? Send a direct dispatch to our team.",
                "form.category": "Reason for Inquiry *",
                "opt.general": "General Feedback / Inquiry",
                "opt.bug": "Report Broken Project / Bug",
                "opt.dmca": "Copyright / DMCA Takedown Notice",
                "form.name": "Your Name *",
                "form.email": "Your Email Address *",
                "form.message": "Message / Details *",
                "form.submit": "Send Message ➔"
            },
            ar: {
                "meta.title": "مركز الدعم والتواصل — I’M AFK",
                "nav.home": "الرئيسية",
                "nav.library": "المكتبة",
                "nav.studio": "المحرر",
                "nav.submit": "إرسال مشروع",
                "nav.support": "الدعم",
                "nav.back": "← العودة إلى الرئيسية",
                "contact.title": "الدعم والتواصل",
                "contact.lead": "هل لديك اقتراح، إبلاغ عن مشكلة برمجية، أو إشعار بخصوص حقوق النشر؟ أرسل رسالتك مباشرة لفريق المنصة.",
                "form.category": "سبب التواصل *",
                "opt.general": "استفسار عام / اقتراح",
                "opt.bug": "الإبلاغ عن مشروع لا يعمل",
                "opt.dmca": "إشعار حقوق النشر / DMCA",
                "form.name": "الاسم *",
                "form.email": "البريد الإلكتروني *",
                "form.message": "تفاصيل الرسالة *",
                "form.submit": "إرسال الرسالة ➔"
            }
        };

        let currentLang = 'en';
        const langBtn = document.getElementById('lang-btn');

        function setLanguage(lang) {
            currentLang = lang;
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            langBtn.textContent = lang === 'en' ? 'العربية' : 'English';
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (I18N[lang] && I18N[lang][key]) el.textContent = I18N[lang][key];
            });
        }
        langBtn.addEventListener('click', () => setLanguage(currentLang === 'en' ? 'ar' : 'en'));

        /* -------------------------------------------------------------
           2. THEME ENGINE
        ------------------------------------------------------------- */
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') || 'dark';
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('afk_studio_theme', next);
        }

        const savedTheme = localStorage.getItem('afk_studio_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</body>
</html>
