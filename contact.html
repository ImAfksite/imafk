<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact & Support — I’M AFK</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-display: 'Space Grotesk', -apple-system, sans-serif;
            
            --nav-height: 56px;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-pill: 9999px;
            --transition: 0.2s ease;
        }

        /* DARK THEME */
        [data-theme="dark"] {
            --bg-canvas: #121615;
            --bg-surface: rgba(22, 28, 27, 0.85);
            --bg-card: rgba(28, 36, 34, 0.9);
            --bg-input: #18201E;
            --bg-hover: rgba(255, 255, 255, 0.05);

            --border: rgba(255, 255, 255, 0.09);
            --border-strong: rgba(255, 255, 255, 0.18);

            --text-main: #EDF3F1;
            --text-secondary: #9EB3AD;
            --text-muted: #6B807A;

            --brand: #5B9287;
            --brand-hover: #487A70;
            --brand-soft: rgba(91, 146, 135, 0.18);
        }

        /* LIGHT THEME */
        [data-theme="light"] {
            --bg-canvas: #F7F9F8;
            --bg-surface: rgba(255, 255, 255, 0.85);
            --bg-card: #FFFFFF;
            --bg-input: #FFFFFF;
            --bg-hover: rgba(0, 0, 0, 0.04);

            --border: rgba(0, 0, 0, 0.08);
            --border-strong: rgba(0, 0, 0, 0.16);

            --text-main: #20332F;
            --text-secondary: #536B66;
            --text-muted: #859E98;

            --brand: #43766C;
            --brand-hover: #355E56;
            --brand-soft: #DDEBE6;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-canvas);
            color: var(--text-main);
            font-family: var(--font-ui);
            font-size: 14px;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .content-width {
            max-width: 680px;
            width: 100%;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Navigation */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            height: var(--nav-height);
            background: var(--bg-surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 clamp(16px, 4vw, 36px);
        }

        .brand-link {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 700;
            font-family: var(--font-display);
            font-size: 1rem;
        }

        .brand-badge {
            width: 24px;
            height: 24px;
            background: var(--brand);
            color: #FFFFFF;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 22px;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: var(--transition);
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--text-main);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 7px 14px;
            border-radius: var(--radius-sm);
            font-family: var(--font-ui);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
        }

        .btn:hover {
            border-color: var(--border-strong);
            background: var(--bg-hover);
        }

        .btn-primary {
            background: var(--brand);
            border-color: var(--brand);
            color: #FFFFFF;
        }

        .btn-primary:hover {
            background: var(--brand-hover);
            color: #FFFFFF;
        }

        /* Hero */
        .hero {
            padding: 40px 0 24px 0;
            text-align: center;
        }

        .hero h1 {
            font-family: var(--font-display);
            font-size: clamp(1.8rem, 3.5vw, 2.6rem);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .hero p {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        /* Form Card */
        .form-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 28px;
            margin-bottom: 50px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 18px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            color: var(--text-main);
            font-family: var(--font-ui);
            font-size: 13px;
            outline: none;
            transition: var(--transition);
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            border-color: var(--brand);
        }

        .form-select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239EB3AD' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 16px;
            padding-right: 40px;
        }

        .form-select option {
            background: var(--bg-card);
            color: var(--text-main);
        }

        .form-textarea {
            min-height: 140px;
            resize: vertical;
            line-height: 1.5;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            border-radius: var(--radius-pill);
            justify-content: center;
        }

        /* Footer */
        footer {
            border-top: 1px solid var(--border);
            padding: 24px clamp(16px, 4vw, 36px);
            background: var(--bg-surface);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: auto;
        }

        @media (max-width: 600px) {
            .nav-links { display: none; }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header class="navbar">
        <a href="index.html" class="brand-link" title="I’M AFK Hub">
            <div class="brand-badge">✦</div>
            <span>I’M AFK</span>
        </a>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="library.html">Library</a></li>
            <li><a href="studio.html">Studio</a></li>
            <li><a href="submit.html">Submit</a></li>
            <li><a href="contact.html" class="active">Support</a></li>
        </ul>

        <div class="nav-actions">
            <a href="studio.html" class="btn btn-primary">+ Create Project</a>
            <button type="button" class="btn" onclick="toggleTheme()" title="Switch Theme">◐</button>
        </div>
    </header>

    <div class="content-width">
        <section class="hero">
            <h1>Contact & Support</h1>
            <p>Have feedback, spotted a broken game, or need a project removed? Send us a message.</p>
        </section>

        <!-- Form Card -->
        <main class="form-card">
            <form action="https://formspree.io/f/mjybeepe" method="POST" id="contactForm">
                <div class="form-grid">
                    
                    <div class="input-group full-width">
                        <label for="category">Topic *</label>
                        <select name="Category" id="category" class="form-select" required>
                            <option value="General Contact">General question or feedback</option>
                            <option value="Report Issue">Report a broken game or bug</option>
                            <option value="Copyright/DMCA">Copyright / DMCA removal request</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="name">Your Name *</label>
                        <input type="text" name="name" id="name" class="form-input" placeholder="Your name" required>
                    </div>

                    <div class="input-group">
                        <label for="email">Email Address *</label>
                        <input type="email" name="email" id="email" class="form-input" placeholder="you@example.com" required>
                    </div>

                    <div class="input-group full-width">
                        <label for="message">Message *</label>
                        <textarea name="message" id="message" class="form-textarea" placeholder="How can we help?" required></textarea>
                    </div>

                </div>

                <!-- Anti-spam honeypot -->
                <input type="text" name="_gotcha" style="display:none">

                <button type="submit" class="btn btn-primary submit-btn">
                    Send Message ➔
                </button>
            </form>
        </main>
    </div>

    <!-- Footer -->
    <footer>
        <span>&copy; 2026 I’M AFK</span>
        <span>Support & Help</span>
    </footer>

    <script>
        /* Theme Toggle */
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') || 'dark';
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('afk_theme', next);
        }

        const savedTheme = localStorage.getItem('afk_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</body>
</html>
