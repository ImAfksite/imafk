<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to I’m Afk</title>
    <style>
        body {
            font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
            line-height: 1.7;
            color: #333333;
            background-color: #f0f2f5; 
            margin: 0;
            padding: 40px 20px;
            animation: fadeInBody 1s ease-in;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff; 
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            border: 1px solid #e1e4e8;
            animation: slideUp 0.8s ease-out;
        }

        /* AGREEMENT BANNER */
        #tos-banner {
            text-align: center;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9em;
            display: none;
        }
        .tos-pending { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .tos-verified { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }

        header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeIn 1.5s ease-in;
        }
        h1 { color: #1a73e8; font-size: 2.5em; margin-bottom: 10px; }
        h2 { color: #202124; border-bottom: 2px solid #f0f2f5; padding-bottom: 8px; margin-top: 35px; }
        
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin: 25px 0;
        }
        .game-card {
            background: #fff;
            border: 1px solid #e1e4e8;
            border-radius: 10px;
            overflow: hidden;
            text-decoration: none;
            color: #333;
            transition: 0.3s;
            display: block;
            animation: cardScale 0.5s ease-out backwards;
        }
        .game-card:hover { transform: translateY(-5px) scale(1.02); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .game-thumb { width: 100%; height: 130px; background: #eee; background-size: cover; background-position: center; border-bottom: 1px solid #eee; }
        .game-title { padding: 12px; font-weight: bold; font-size: 0.95em; text-align: center; }

        .btn-container { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
        .action-btn {
            display: inline-block;
            text-decoration: none;
            background-color: #1a73e8;
            color: white !important;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .action-btn:hover { background-color: #1557b0; transform: translateY(-3px); }
        .action-btn.secondary { background-color: #5f6368; }

        #loading-status { text-align: center; padding: 20px; color: #1a73e8; font-weight: bold; animation: blink 1.5s infinite; }

        @keyframes fadeInBody { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideInLeft { from { transform: translateX(-20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes cardScale { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes blink { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
    </style>
</head>
<body>

<div class="container">
    <div id="tos-banner"></div>

    <header>
        <h1>Welcome to I’m Afk</h1>
        <p>High-quality games accessible directly in your browser.</p>
    </header>

    <main>
        <section id="auto-games">
            <h2>Game Library</h2>
            <div id="loading-status">Scanning GitHub for games...</div>
            <div class="game-grid" id="game-container"></div>
        </section>

        <section style="margin-top: 50px; text-align: center; border-top: 2px solid #f0f2f5; padding-top: 30px;">
            <h2>Support & Contributions</h2>
            <div class="btn-container">
                <a href="contact.html" class="action-btn">Contact / Report</a>
                <a href="submit.html" class="action-btn secondary">Submit Project</a>
            </div>
        </section>
    </main>

    <footer style="margin-top: 40px; text-align: center; color: #9aa0a6; font-size: 0.8em;">
        Last updated: 15 August 2026
    </footer>
</div>

<script>
    // --- CONFIGURATION ---
    const GITHUB_USER = 'YOUR_GITHUB_USERNAME'; // <--- CHANGE THIS
    const GITHUB_REPO = 'imafk';               // <--- CHANGE THIS (Repo Name)
    const STORAGE_KEY = 'imAfk_Agreed_Final';

    // 1. Check Agreement
    function checkTOS() {
        const banner = document.getElementById('tos-banner');
        const hasAgreed = localStorage.getItem(STORAGE_KEY);
        banner.style.display = 'block';
        if (hasAgreed === 'true') {
            banner.className = 'tos-verified';
            banner.innerHTML = '✓ Legal Agreement Verified';
        } else {
            banner.className = 'tos-pending';
            banner.innerHTML = '⚠️ Warning: Agreement not signed. <a href="tos.html">View Terms</a>';
        }
    }

    // 2. Automatic Game Loader
    async function loadGames() {
        const container = document.getElementById('game-container');
        const status = document.getElementById('loading-status');
        
        try {
            // Scan your GitHub folder
            const repoUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/games`;
            const response = await fetch(repoUrl);
            const files = await response.json();

            if (Array.isArray(files)) {
                files.forEach((file, index) => {
                    if (file.name.endsWith('.html')) {
                        // Create Title from Filename (snake-game.html -> Snake Game)
                        const title = file.name.replace('.html', '').replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                        const url = `https://${GITHUB_USER}.github.io/${GITHUB_REPO}/games/${file.name}`;
                        const thumb = `https://s.wordpress.com/mshots/v1/${encodeURIComponent(url)}?w=400`;

                        addCard(title, url, thumb, index);
                    }
                });
                status.style.display = 'none';
            }
        } catch (e) {
            status.innerHTML = "Error loading games. Make sure the 'games' folder exists on GitHub.";
        }
    }

    function addCard(title, url, thumb, delay) {
        const container = document.getElementById('game-container');
        const card = document.createElement('a');
        card.className = 'game-card';
        card.href = url;
        card.target = "_blank";
        card.style.animationDelay = (delay * 0.1) + 's';
        card.innerHTML = `
            <div class="game-thumb" style="background-image: url('${thumb}')"></div>
            <div class="game-title">${title}</div>
        `;
        container.appendChild(card);
    }

    checkTOS();
    loadGames();
</script>

</body>
</html>
