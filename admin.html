<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moderation Node — I’m Afk</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bg-deep: #0a0a12;
            --glass-card: rgba(16, 22, 36, 0.75);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-ice: #67e8f9;
            --danger: #ef4444;
            --font-display: 'Space Grotesk', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-deep);
            background-image: radial-gradient(circle at 50% 20%, rgba(45, 111, 212, 0.18) 0%, transparent 60%);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 1050px;
        }

        .auth-card {
            max-width: 420px;
            margin: 100px auto 0;
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 40px;
            backdrop-filter: blur(25px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .input-group input {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid var(--glass-border);
            background: #090d16;
            color: #fff;
            font-family: var(--font-mono);
            font-size: 1.1rem;
            text-align: center;
            letter-spacing: 3px;
            outline: none;
            margin-bottom: 16px;
        }

        .btn-unlock {
            width: 100%;
            background: #ffffff;
            color: #0a0a12;
            padding: 14px;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-unlock:hover {
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }

        #admin-panel { display: none; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .game-card {
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--glass-border);
            color: #fff;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
        }
        .btn-action:hover { background: #ffffff; color: #0a0a12; }

        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border-color: rgba(239, 68, 68, 0.3);
        }
        .btn-danger:hover { background: var(--danger); color: #fff; }

        /* Preview Modal */
        .preview-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 18, 0.85);
            backdrop-filter: blur(20px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .preview-box {
            width: min(95vw, 1000px);
            height: 82vh;
            background: #090d16;
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #preview-frame { flex: 1; border: none; background: #000; }
    </style>
</head>
<body>

    <div class="container" id="auth-gate">
        <div class="auth-card">
            <div style="font-size: 2rem; margin-bottom: 16px;">🛡️</div>
            <h2 style="font-family: var(--font-display); font-size: 1.4rem; margin-bottom: 6px;">Moderation Portal</h2>
            <p style="color: var(--text-muted); font-size: 0.88rem; margin-bottom: 24px;">Enter the security key to manage platform entries.</p>
            <form onsubmit="event.preventDefault(); verifyPasscode();">
                <div class="input-group">
                    <input type="password" id="pass-input" placeholder="••••••••••••••" autocomplete="off" required>
                </div>
                <button type="submit" class="btn-unlock">Unlock Portal →</button>
            </form>
            <div id="warning-text" style="color: var(--danger); font-size: 0.82rem; margin-top: 12px; font-weight: 600;"></div>
        </div>
    </div>

    <div class="container" id="admin-panel">
        <header>
            <div>
                <h1 style="font-family: var(--font-display); font-size: 1.6rem;">Moderation Dashboard</h1>
                <p style="color: var(--text-muted); font-size: 0.85rem;">Review submissions and manage published catalog items.</p>
            </div>
            <div style="display: flex; gap: 10px;">
                <a href="index.html" class="btn-action">Return to Hub</a>
                <button class="btn-action btn-danger" onclick="terminateSession()">Lock</button>
            </div>
        </header>

        <div id="games-feed">Loading games feed...</div>
    </div>

    <div class="preview-modal" id="preview-modal" onclick="if(event.target === this) closePreview();">
        <div class="preview-box">
            <div style="padding: 14px 20px; background: rgba(16, 22, 36, 0.9); color: #fff; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--glass-border);">
                <span id="preview-title" style="font-weight: 700; color: var(--accent-ice);">Sandbox Preview</span>
                <button class="btn-action" onclick="closePreview()">✕ Close</button>
            </div>
            <iframe id="preview-frame" sandbox="allow-scripts allow-forms allow-pointer-lock" allow="fullscreen; autoplay; gamepad"></iframe>
        </div>
    </div>

    <script>
        const _k = [95, 118, 124, 121, 114, 133, 130, 128, 63, 61, 62, 61];
        const SUPABASE_URL = 'https://xtzbbqdlidefzsfiixwm.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh0emJicWRsaWRlZnpzZmlpeHdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczNjMzMjIsImV4cCI6MjEwMjkzOTMyMn0.jONPEEgyCYsv6lapUgVgeixHyWLYtfadveQZJUPm26Y';
        const sbClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        let allGames = [];

        if (sessionStorage.getItem('afk_authenticated') === 'true') grantAccess();

        function verifyPasscode() {
            const input = document.getElementById('pass-input').value.trim();
            const match = input.length === _k.length && [...input].every((c, i) => c.charCodeAt(0) + 13 === _k[i]);
            if (match) {
                sessionStorage.setItem('afk_authenticated', 'true');
                grantAccess();
            } else {
                document.getElementById('pass-input').value = '';
                document.getElementById('warning-text').textContent = 'Invalid authorization key.';
            }
        }

        function grantAccess() {
            document.getElementById('auth-gate').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
            fetchList();
        }

        function terminateSession() {
            sessionStorage.removeItem('afk_authenticated');
            window.location.reload();
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        async function fetchList() {
            const feed = document.getElementById('games-feed');
            if (!sbClient) return feed.innerHTML = "<p>Supabase client not connected.</p>";
            const { data, error } = await sbClient.from('games').select('*').order('created_at', { ascending: false });
            if (error) return feed.innerHTML = `<p>Error: ${escapeHtml(error.message)}</p>`;
            allGames = data || [];
            if (!allGames.length) return feed.innerHTML = "<p>No submissions found.</p>";

            feed.innerHTML = '';
            allGames.forEach(game => {
                const isLive = (game.status || 'live') === 'live';
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <div>
                        <h3 style="margin-bottom: 4px;">${escapeHtml(game.title)} <span style="font-size: 0.75rem; color: ${isLive ? '#4ade80' : 'var(--danger)'};">(${isLive ? 'LIVE' : 'TAKEN DOWN'})</span></h3>
                        <p style="color: var(--text-muted); font-size: 0.85rem;">Author: ${escapeHtml(game.author)} &bull; Email: ${escapeHtml(game.email)}</p>
                    </div>
                    <div style="display: flex; gap: 8px;">
                        <button class="btn-action" onclick="testGame('${escapeHtml(game.id)}')">⚡ Test</button>
                        ${isLive 
                            ? `<button class="btn-action btn-danger" onclick="toggleStatus('${escapeHtml(game.id)}', 'takedown')">Takedown</button>`
                            : `<button class="btn-action" onclick="toggleStatus('${escapeHtml(game.id)}', 'live')">Restore</button>`
                        }
                        <button class="btn-action btn-danger" onclick="deleteGame('${escapeHtml(game.id)}')">Delete</button>
                    </div>
                `;
                feed.appendChild(card);
            });
        }

        async function toggleStatus(id, status) {
            await sbClient.from('games').update({ status }).eq('id', id);
            fetchList();
        }

        async function deleteGame(id) {
            if (confirm("Permanently delete this entry?")) {
                await sbClient.from('games').delete().eq('id', id);
                fetchList();
            }
        }

        function testGame(id) {
            const game = allGames.find(g => String(g.id) === String(id));
            if (!game) return;
            document.getElementById('preview-title').textContent = `Testing: ${game.title}`;
            document.getElementById('preview-frame').srcdoc = game.html_code || '';
            document.getElementById('preview-modal').style.display = 'flex';
        }

        function closePreview() {
            document.getElementById('preview-modal').style.display = 'none';
            document.getElementById('preview-frame').srcdoc = '';
        }
    </script>
</body>
</html>
