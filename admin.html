<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encrypted Dev Node — I’m Afk</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bg: #04060a;
            --card-bg: rgba(13, 19, 31, 0.85);
            --neon-mint: #00ffd6;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text-main: #f3f4f6;
            --text-muted: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.1);
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(0, 255, 214, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 214, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            position: relative;
            z-index: 1;
        }

        /* --- Security Gate Lockbox --- */
        .auth-card {
            max-width: 440px;
            margin: 100px auto 0;
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 40px;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 30px rgba(0, 255, 214, 0.1);
            text-align: center;
        }

        .shield-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 20px;
            border-radius: 18px;
            background: rgba(0, 255, 214, 0.1);
            border: 1px solid rgba(0, 255, 214, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            box-shadow: 0 0 20px rgba(0, 255, 214, 0.2);
        }

        .auth-card h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .auth-card p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 24px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 14px;
            border: 1px solid var(--glass-border);
            background: #080c14;
            color: #fff;
            font-family: var(--font-mono);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
            text-align: center;
            letter-spacing: 2px;
        }

        .input-group input:focus {
            border-color: var(--neon-mint);
            box-shadow: 0 0 20px rgba(0, 255, 214, 0.2);
        }

        .btn-unlock {
            width: 100%;
            background: linear-gradient(135deg, var(--neon-mint), #3b82f6);
            color: #040807;
            padding: 14px;
            border: none;
            border-radius: 50px;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 10px 20px rgba(0, 255, 214, 0.25);
        }

        .btn-unlock:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(0, 255, 214, 0.4);
        }

        .attempts-counter {
            font-size: 0.78rem;
            color: var(--danger);
            margin-top: 14px;
            font-weight: 600;
        }

        /* --- Dashboard Panel --- */
        #admin-panel {
            display: none;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .dev-badge {
            background: rgba(0, 255, 214, 0.15);
            color: var(--neon-mint);
            border: 1px solid rgba(0, 255, 214, 0.3);
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 6px;
            display: inline-block;
        }

        .panel-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--glass-border);
            color: #fff;
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;
        }

        .btn-action:hover {
            border-color: var(--neon-mint);
            color: var(--neon-mint);
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.3);
            color: #f87171;
        }

        .btn-logout:hover {
            background: var(--danger);
            color: #fff;
        }

        .game-card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 24px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            backdrop-filter: blur(15px);
        }

        .status-pill {
            padding: 4px 10px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .status-live { background: rgba(0, 255, 214, 0.15); color: var(--neon-mint); }
        .status-removed { background: rgba(239, 68, 68, 0.15); color: var(--danger); }

        .btn-test { background: rgba(255, 255, 255, 0.08); color: #fff; border: 1px solid var(--glass-border); }
        .btn-test:hover { background: var(--neon-mint); color: #000; }
        .btn-takedown { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }
        .btn-takedown:hover { background: var(--danger); color: #fff; }

        .preview-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .preview-box {
            width: min(95vw, 1100px);
            height: 85vh;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--glass-border);
        }
        #preview-frame { flex: 1; border: none; background: #000; }
    </style>
</head>
<body>

    <!-- Security Gate -->
    <div class="container" id="auth-gate">
        <div class="auth-card">
            <div class="shield-icon">🛡️</div>
            <h2>Dev Authentication</h2>
            <p>Enter your authorization key to proceed.</p>
            
            <form id="auth-form" onsubmit="event.preventDefault(); verifyPasscode();">
                <div class="input-group">
                    <input type="password" id="pass-input" placeholder="••••••••••••••" autocomplete="off" required>
                </div>
                <button type="submit" class="btn-unlock" id="unlock-btn">Authorize Session ➔</button>
            </form>
            
            <div class="attempts-counter" id="warning-text"></div>
        </div>
    </div>

    <!-- Active Moderator Dashboard -->
    <div class="container" id="admin-panel">
        <header>
            <div>
                <span class="dev-badge">✓ Authenticated Root Session</span>
                <h1 style="font-size: 1.8rem; margin: 4px 0;">Arcade Moderation Node</h1>
                <p style="color: var(--text-muted); font-size: 0.85rem;">Review submissions, run real-time tests, and publish takedown notices.</p>
            </div>
            <div class="panel-actions">
                <a href="index.html" class="btn-action">Return to Hub</a>
                <button class="btn-action btn-logout" onclick="terminateSession()">Lock Session</button>
            </div>
        </header>

        <div id="games-feed">Loading games from database...</div>
    </div>

    <!-- Sandbox Test Modal -->
    <div class="preview-modal" id="preview-modal" onclick="if(event.target === this) closePreview();">
        <div class="preview-box">
            <div style="padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; background: #111; border-bottom: 1px solid var(--glass-border);">
                <span id="preview-title" style="font-weight: 700; color: var(--neon-mint);">Test Environment</span>
                <button class="btn-action" onclick="closePreview()">✕ Close Sandbox</button>
            </div>
            <iframe id="preview-frame" sandbox="allow-scripts allow-forms allow-pointer-lock" allow="fullscreen; autoplay; gamepad"></iframe>
        </div>
    </div>

    <script>
        // Encoded key token (not readable in plain text)
        const _k = [95, 118, 124, 121, 114, 133, 130, 128, 63, 61, 62, 61];

        const SUPABASE_URL = 'https://xtzbbqdlidefzsfiixwm.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh0emJicWRsaWRlZnpzZmlpeHdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczNjMzMjIsImV4cCI6MjEwMjkzOTMyMn0.jONPEEgyCYsv6lapUgVgeixHyWLYtfadveQZJUPm26Y';

        let sbClient = null;
        if (window.supabase && typeof window.supabase.createClient === 'function') {
            sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        let allGames = [];

        // Check if session is already stored
        if (sessionStorage.getItem('afk_authenticated') === 'true') {
            grantAccess();
        }

        function verifyPasscode() {
            const input = document.getElementById('pass-input').value.trim();
            
            // Check transformed byte codes
            const match = input.length === _k.length && 
                          [...input].every((c, i) => c.charCodeAt(0) + 13 === _k[i]);

            if (match) {
                sessionStorage.setItem('afk_authenticated', 'true');
                grantAccess();
            } else {
                document.getElementById('pass-input').value = '';
                document.getElementById('warning-text').textContent = 'Invalid authorization key.';
            }
        }

        function grantAccess() {
            document.getElementById('auth-gate').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
            fetchModerationList();
        }

        function terminateSession() {
            sessionStorage.removeItem('afk_authenticated');
            window.location.reload();
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        async function fetchModerationList() {
            const feed = document.getElementById('games-feed');
            if (!sbClient) {
                feed.innerHTML = "<p style='color: var(--danger);'>Database client connection not available.</p>";
                return;
            }

            const { data, error } = await sbClient
                .from('games')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                feed.innerHTML = `<p style="color: var(--danger);">Database error: ${escapeHtml(error.message)}</p>`;
                return;
            }

            allGames = data || [];
            if (!allGames.length) {
                feed.innerHTML = "<p style='color: var(--text-muted);'>No game submissions recorded.</p>";
                return;
            }

            feed.innerHTML = '';
            allGames.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                const isLive = game.status === 'live';

                card.innerHTML = `
                    <div>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <h3 style="margin: 0; font-size: 1.2rem;">${escapeHtml(game.title)}</h3>
                            <span class="status-pill ${isLive ? 'status-live' : 'status-removed'}">
                                ${escapeHtml((game.status || '').toUpperCase())}
                            </span>
                        </div>
                        <p style="color: var(--text-muted); font-size: 0.85rem; margin: 6px 0;">
                            Author: <strong>${escapeHtml(game.author)}</strong> &bull; Contact: ${escapeHtml(game.email)}
                        </p>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn-action btn-test" onclick="testGame('${escapeHtml(game.id)}')">⚡ Test Code</button>
                    </div>
                `;
                feed.appendChild(card);
            });
        }

        function testGame(id) {
            const game = allGames.find(g => String(g.id) === String(id));
            if (!game) return;
            document.getElementById('preview-title').textContent = `Testing: ${game.title}`;
            const frame = document.getElementById('preview-frame');
            frame.srcdoc = game.html_code || '';
            document.getElementById('preview-modal').style.display = 'flex';
        }

        function closePreview() {
            document.getElementById('preview-modal').style.display = 'none';
            document.getElementById('preview-frame').srcdoc = '';
        }
    </script>
</body>
</html>
