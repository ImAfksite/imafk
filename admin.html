<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encrypted Dev Node — I’m Afk</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bg: #04060a;
            --card-bg: rgba(13, 19, 31, 0.85);
            --neon-mint: #00ffd6;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text-main: #f3f4f6;
            --text-muted: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.1);
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(0, 255, 214, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 214, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            position: relative;
            z-index: 1;
        }

        .auth-card {
            max-width: 440px;
            margin: 100px auto 0;
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 40px;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 30px rgba(0, 255, 214, 0.1);
            text-align: center;
        }

        .shield-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 20px;
            border-radius: 18px;
            background: rgba(0, 255, 214, 0.1);
            border: 1px solid rgba(0, 255, 214, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            box-shadow: 0 0 20px rgba(0, 255, 214, 0.2);
        }

        .auth-card h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .auth-card p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 24px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 14px;
            border: 1px solid var(--glass-border);
            background: #080c14;
            color: #fff;
            font-family: var(--font-mono);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
            text-align: center;
            letter-spacing: 2px;
        }

        .input-group input:focus {
            border-color: var(--neon-mint);
            box-shadow: 0 0 20px rgba(0, 255, 214, 0.2);
        }

        .btn-unlock {
            width: 100%;
            background: linear-gradient(135deg, var(--neon-mint), #3b82f6);
            color: #040807;
            padding: 14px;
            border: none;
            border-radius: 50px;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 10px 20px rgba(0, 255, 214, 0.25);
        }

        .btn-unlock:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(0, 255, 214, 0.4);
        }

        .btn-unlock:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .attempts-counter {
            font-size: 0.78rem;
            color: var(--danger);
            margin-top: 14px;
            font-weight: 600;
        }

        #admin-panel {
            display: none;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .dev-badge {
            background: rgba(0, 255, 214, 0.15);
            color: var(--neon-mint);
            border: 1px solid rgba(0, 255, 214, 0.3);
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 6px;
            display: inline-block;
        }

        .panel-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--glass-border);
            color: #fff;
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;
        }

        .btn-action:hover {
            border-color: var(--neon-mint);
            color: var(--neon-mint);
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.3);
            color: #f87171;
        }

        .btn-logout:hover {
            background: var(--danger);
            color: #fff;
        }

        .game-card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 24px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            backdrop-filter: blur(15px);
        }

        .status-pill {
            padding: 4px 10px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .status-live { background: rgba(0, 255, 214, 0.15); color: var(--neon-mint); }
        .status-removed { background: rgba(239, 68, 68, 0.15); color: var(--danger); }

        .btn-test { background: rgba(255, 255, 255, 0.08); color: #fff; border: 1px solid var(--glass-border); }
        .btn-test:hover { background: var(--neon-mint); color: #000; }
        .btn-takedown { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }
        .btn-takedown:hover { background: var(--danger); color: #fff; }
        .btn-restore { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.4); }
        .btn-restore:hover { background: #10b981; color: #fff; }

        .preview-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .preview-box {
            width: min(95vw, 1100px);
            height: 85vh;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--glass-border);
        }
        #preview-frame { flex: 1; border: none; background: #000; }
    </style>
</head>
<body>

    <!-- Security Gate -->
    <div class="container" id="auth-gate">
        <div class="auth-card">
            <div class="shield-icon">🛡️</div>
            <h2>Dev Authentication</h2>
            <p>Cryptographic SHA-256 handshake required.</p>
            
            <form id="auth-form" onsubmit="event.preventDefault(); verifyPasscode();">
                <div class="input-group">
                    <input type="password" id="pass-input" placeholder="••••••••••••••" autocomplete="off" required>
                </div>
                <button type="submit" class="btn-unlock" id="unlock-btn">Authorize Session ➔</button>
            </form>
            
            <div class="attempts-counter" id="warning-text"></div>
        </div>
    </div>

    <!-- Active Moderator Dashboard -->
    <div class="container" id="admin-panel">
        <header>
            <div>
                <span class="dev-badge">✓ Authenticated Root Session</span>
                <h1 style="font-size: 1.8rem; margin: 4px 0;">Arcade Moderation Node</h1>
                <p style="color: var(--text-muted); font-size: 0.85rem;">Review submissions, run real-time tests, and publish takedown notices.</p>
            </div>
            <div class="panel-actions">
                <a href="index.html" class="btn-action">Return to Hub</a>
                <button class="btn-action btn-logout" onclick="terminateSession()">Lock Session</button>
            </div>
        </header>

        <div id="games-feed">Loading games from database...</div>
    </div>

    <!-- Sandbox Test Modal -->
    <div class="preview-modal" id="preview-modal" onclick="if(event.target === this) closePreview();">
        <div class="preview-box">
            <div style="padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; background: #111; border-bottom: 1px solid var(--glass-border);">
                <span id="preview-title" style="font-weight: 700; color: var(--neon-mint);">Test Environment</span>
                <button class="btn-action" onclick="closePreview()">✕ Close Sandbox</button>
            </div>
            <iframe id="preview-frame" sandbox="allow-scripts allow-forms allow-pointer-lock" allow="fullscreen; autoplay; gamepad"></iframe>
        </div>
    </div>

    <script>
        const ENCRYPTED_AUTH_HASH = "0fa5776d655f5f40350d3023e12c1404c08e5c8e310037a505b82e219760773d";
        const SUPABASE_URL = 'https://xtzbbqdlidefzsfiixwm.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh0emJicWRsaWRlZnpzZmlpeHdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczNjMzMjIsImV4cCI6MjEwMjkzOTMyMn0.jONPEEgyCYsv6lapUgVgeixHyWLYtfadveQZJUPm26Y';
        
        const sbClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
        let allGames = [];
        let failedAttempts = 0;

        // Restore session if active
        if (sessionStorage.getItem('afk_authenticated') === 'true') {
            grantAccess();
        }

        // Pure JavaScript SHA-256 fallback (guaranteed to work in all environments)
        function sha256Pure(ascii) {
            function rightRotate(value, amount) {
                return (value >>> amount) | (value << (32 - amount));
            }
            var mathPow = Math.pow;
            var maxWord = mathPow(2, 32);
            var i, j;
            var result = '';
            var words = [];
            var asciiBitLength = ascii.length * 8;
            var hash = [
                0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a,
                0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19
            ];
            var k = [
                0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
                0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
                0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
                0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
                0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
                0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
                0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
                0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
            ];

            ascii += '\x80';
            while (ascii.length % 64 - 56) ascii += '\x00';
            for (i = 0; i < ascii.length; i++) {
                j = ascii.charCodeAt(i);
                words[i >> 2] |= j << ((3 - i % 4) * 8);
            }
            words[words.length] = ((asciiBitLength / maxWord) | 0);
            words[words.length] = (asciiBitLength);

            for (j = 0; j < words.length;) {
                var w = words.slice(j, j += 16);
                var oldHash = hash;
                hash = hash.slice(0, 8);

                for (i = 0; i < 64; i++) {
                    var i2 = i + j;
                    var w15 = w[i - 15], w2 = w[i - 2];
                    var a = hash[0], e = hash[4];
                    var temp1 = hash[7]
                        + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
                        + ((e & hash[5]) ^ ((~e) & hash[6]))
                        + k[i]
                        + (w[i] = (i < 16) ? w[i] : (
                                w[i - 16]
                                + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
                                + w[i - 7]
                                + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
                            ) | 0
                        );
                    var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
                        + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));

                    hash = [(temp1 + temp2) | 0].concat(hash);
                    hash[4] = (hash[4] + temp1) | 0;
                }

                for (i = 0; i < 8; i++) {
                    hash[i] = (hash[i] + oldHash[i]) | 0;
                }
            }

            for (i = 0; i < 8; i++) {
                for (j = 3; j >= 0; j--) {
                    var b = (hash[i] >> (j * 8)) & 255;
                    result += ((b < 16) ? '0' : '') + b.toString(16);
                }
            }
            return result;
        }

        async function verifyPasscode() {
            const input = document.getElementById('pass-input').value.trim();
            const inputHash = sha256Pure(input);

            if (inputHash === ENCRYPTED_AUTH_HASH) {
                sessionStorage.setItem('afk_authenticated', 'true');
                grantAccess();
            } else {
                failedAttempts++;
                document.getElementById('pass-input').value = '';
                document.getElementById('warning-text').textContent = 'Invalid credentials. Please try again.';
            }
        }

        function grantAccess() {
            document.getElementById('auth-gate').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
            fetchModerationList();
        }

        function terminateSession() {
            sessionStorage.removeItem('afk_authenticated');
            window.location.href = 'index.html';
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        async function fetchModerationList() {
            const feed = document.getElementById('games-feed');
            if (!sbClient) {
                feed.innerHTML = "<p style='color: var(--danger);'>Supabase SDK failed to load.</p>";
                return;
            }

            const { data, error } = await sbClient
                .from('games')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                feed.innerHTML = `<p style="color: var(--danger);">Database Error: ${escapeHtml(error.message)}</p>`;
                return;
            }

            allGames = data || [];
            if (!allGames.length) {
                feed.innerHTML = "<p style='color: var(--text-muted);'>No game submissions found.</p>";
                return;
            }

            feed.innerHTML = '';
            allGames.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                const isLive = game.status === 'live';

                card.innerHTML = `
                    <div>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <h3 style="margin: 0; font-size: 1.2rem;">${escapeHtml(game.title)}</h3>
                            <span class="status-pill ${isLive ? 'status-live' : 'status-removed'}">
                                ${escapeHtml((game.status || '').toUpperCase())}
                            </span>
                        </div>
                        <p style="color: var(--text-muted); font-size: 0.85rem; margin: 6px 0;">
                            Author: <strong>${escapeHtml(game.author)}</strong> &bull; Contact: ${escapeHtml(game.email)}
                        </p>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn-action btn-test" onclick="testGame('${escapeHtml(game.id)}')">⚡ Test Code</button>
                        <button class="btn-action btn-takedown" onclick="triggerTakedown('${escapeHtml(game.id)}')">🚨 Take Down</button>
                    </div>
                `;
                feed.appendChild(card);
            });
        }

        function testGame(id) {
            const game = allGames.find(g => String(g.id) === String(id));
            if (!game) return;
            document.getElementById('preview-title').textContent = `Testing: ${game.title}`;
            document.getElementById('preview-frame').srcdoc = game.html_code || '';
            document.getElementById('preview-modal').style.display = 'flex';
        }

        function closePreview() {
            document.getElementById('preview-modal').style.display = 'none';
            document.getElementById('preview-frame').srcdoc = '';
        }
    </script>
</body>
</html>
