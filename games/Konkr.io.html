  <title>Konkr.io</title>
  <style>
    html,
    body {
      font-family: Georgia, Arial, Trebuchet;
      margin: 0;
      background-color: #327DA0;
      overflow: hidden
    }

    h1 {
      text-align: center;
      position: fixed;
      font-size: 2em;
      font-weight: normal;
      top: calc(50vh + 120px);
      left: 0;
      margin: 0 auto;
      width: 100%;
      color: #161632;
    }

    h2 {
      text-align: center;
      position: fixed;
      font-size: 1em;
      font-weight: normal;
      font-style: italic;
      top: calc(50% + 170px);
      left: 0;
      margin: 0 auto;
      width: 100%;
      color: #161632;
    }

    .center-screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      min-height: 100vh;
    }

    #phaser-game {
      position: fixed;
      pointer-events: auto;
      background-color: #327DA0;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
    }

    .hidden {
      visibility: hidden
    }

    li {
      text-align: left;
    }

    #status {
      margin: 15px auto;
      position: relative;
      color: white;
      font-size: 1em;
      font-weight: bold;
      font-style: italic;
    }

    /* hide news box if there's not enough screen estate for it */
    @media only screen and (max-width: 890px) {
      #news-box {
        visibility: hidden;
      }
    }

    /* Dat.gui styles */
    .dg.main {
      position: absolute;
      left: 0px
    }

    /* File dropzone */
    #file-drop-zone {
      display: flex;
      position: fixed;
      width: 100%;
      height: 100%;
      background-color: #ffffff90;
      padding: 40px;
    }

    #file-drop-zone>div {
      display: flex;
      box-sizing: border-box;
      color: #3b5998;
      border: 4px dashed #3b5998;
      margin: 20px;
      padding: 20px;
      font-size: 4rem;
      flex-grow: 1;
      align-content: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    #file-drop-zone * {
      pointer-events: none;
    }

    /* Loader */
    #loader {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: block;
      margin: 15px auto;
      position: relative;
      color: #FFF;
      left: -100px;
      box-sizing: border-box;
      animation: shadowRolling 2s linear infinite;
    }

    @keyframes shadowRolling {
      0% {
        box-shadow: 0px 0 rgba(255, 255, 255, 0), 0px 0 rgba(255, 255, 255, 0), 0px 0 rgba(255, 255, 255, 0), 0px 0 rgba(255, 255, 255, 0);
      }

      12% {
        box-shadow: 100px 0 white, 0px 0 rgba(255, 255, 255, 0), 0px 0 rgba(255, 255, 255, 0), 0px 0 rgba(255, 255, 255, 0);
      }

      25% {
        box-shadow: 110px 0 white, 100px 0 white, 0px 0 rgba(255, 255, 255, 0), 0px 0 rgba(255, 255, 255, 0);
      }

      36% {
        box-shadow: 120px index0 white, 110px 0 white, 100px 0 white, 0px 0 rgba(255, 255, 255, 0);
      }

      50% {
        box-shadow: 130px 0 white, 120px 0 white, 110px 0 white, 100px 0 white;
      }

      62% {
        box-shadow: 200px 0 rgba(255, 255, 255, 0), 130px 0 white, 120px 0 white, 110px 0 white;
      }

      75% {
        box-shadow: 200px 0 rgba(255, 255, 255, 0), 200px 0 rgba(255, 255, 255, 0), 130px 0 white, 120px 0 white;
      }

      87% {
        box-shadow: 200px 0 rgba(255, 255, 255, 0), 200px 0 rgba(255, 255, 255, 0), 200px 0 rgba(255, 255, 255, 0), 130px 0 white;
      }

      100% {
        box-shadow: 200px 0 rgba(255, 255, 255, 0), 200px 0 rgba(255, 255, 255, 0), 200px 0 rgba(255, 255, 255, 0), 200px 0 rgba(255, 255, 255, 0);
      }
    }

    /* NEWS BOX*/
    #news-box {
      position: absolute;
      width: 400px;
      left: calc(50% - 200px);
      bottom: 40px;
      transition: all 300ms ease-in-out;
      font-size: 14px;
      text-align: left;
      color: #f2f2f2;
    }

    #news-box article {
      padding: 14px 14px 6px;
      background-color: rgb(30, 75, 96);
      border-radius: 14px 14px 0 0;
      line-height: 1.3;
    }

    #news-box footer {
      padding: 14px;
    }

    #news-box h3 {
      margin-bottom: 8px;
      margin-top: 0px;
      font-family: Helvetica, Arial, sans-serif;
      ;
      font-weight: bold;
    }

    #news-box article a {
      color: #73afff;
      text-decoration: none;
    }

    #news-box article h3 a,
    #news-box article h3 a:visited,
    #news-box footer a,
    #news-box footer a:visited {
      color: #f2f2f2;
      text-decoration: none;
    }

    #news-box p.posted-at {
      margin: 0;
      margin-top: 4px;
      color: #cccccc;
      font-size: small;
      float: right;
    }

    #news-box p {
      margin-bottom: 8px;
      color: #f2f2f2;
    }

    #news-box footer {
      font-size: small;
      height: 15px;
      box-sizing: content-box;
    }

    #news-box-button {
      display: table;
      margin-left: auto;
      padding: 6px 10px;
      border-radius: 6px;
      background-color: #193E50;
      color: #f2f2f2;
      text-decoration: none;
      font-weight: bold;
      font-size: small;
    }

    #footer-placeholder {
      position: fixed;
      height: 83px;
      background-color: #193E50;
      width: 100%;
      bottom: 0;
    }
  </style>

  <script>
    const BUILD_NUMBER = '2.35.27'
    const SW_ENABLE = true
    // store current time for timing page load
    window.tStart = performance.now()
    const statusElement = document.getElementById('status')
    const loaderElement = document.getElementById('loader')
    const gameElement = document.getElementById('phaser-game')
    window.setLoadingStatus = (status, isLoading) => {
      statusElement.innerHTML = status
      if (isLoading === false) {
        loaderElement.classList.add('hidden')
        if (!status) {
          gameElement.classList.remove('hidden')
        } else {
          gameElement.classList.add('hidden')
        }
      } else {
        loaderElement.classList.remove('hidden')
        gameElement.classList.add('hidden')
      }
    }
    // if news-box has no content, inject warning
    const newsBox = document.getElementById('news-box-body')
    if (newsBox?.innerText.startsWith(' + ')) {
      newsBox.innerHTML = `<article><b>⚠ Warning:</b> Playing unsupported game version</p><p><code>${BUILD_NUMBER}</code></p>
                         <p>Visit <a href='https://www.konkr.io'>www.konkr.io</a> to play the latest stable release.<br/>
                         Or don't, I'm not your boss, but proceed with caution.</p></article>`
    }
    setLoadingStatus('loading game...')
    window.addEventListener('DOMContentLoaded', () => boot())

    function supportsServiceWorker() {
      try {
        return !!(window.localStorage && navigator.serviceWorker);
      } catch (e) {
        return false;
      }
    }
    async function boot(safeMode = false) {
      if (!safeMode && supportsServiceWorker()) {
        try {
          const cachedBuild = window.localStorage?.getItem('konkr.cached_build')
          window.localStorage.setItem('konkr.cached_build', BUILD_NUMBER)
          if (cachedBuild && cachedBuild !== BUILD_NUMBER) {
            setLoadingStatus('downloading update...')
            //new version detected => purge cache and any old service workers and reload
            console.warn(`New version is available! (installed = ${cachedBuild}, available = ${BUILD_NUMBER}), updating!`)
            window.caches?.keys()
              .then(cacheNames => {
                cacheNames.forEach(cacheName => {
                  caches.delete(cacheName)
                })
              })
              .then(purgeServiceWorkers)
              .then(() => {
                window.location.reload()
              })
            return
          } else {
            //version recognized, everything is most likely already cached by SW
            setLoadingStatus('loading game...')
            window.launchGame()
          }
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            //reload if new service worker takes control of running app
            console.info('new service worker activated')
          })
          if (SW_ENABLE) {
            navigator.serviceWorker.register('./sw.js', {
              scope: window.location.href
            }).catch(err => {
              console.error('Failed to register service worker', err)
            })
          } else {
            await purgeServiceWorkers()
          }
        } catch (error) {
          console.error('error updating game, restarting in safe mode')
          try {
            await purgeServiceWorkers()
          } catch (error) {
            console.error('failed to purge service workers')
          }
          await boot(true)
        }
      } else {
        setLoadingStatus('loading game...')
        window.launchGame()
      }
    }

    function purgeServiceWorkers() {
      return navigator.serviceWorker.getRegistrations()
        .then(registrations => {
          for (let registration of registrations) {
            registration.unregister()
          }
        })
    }
  </script>
