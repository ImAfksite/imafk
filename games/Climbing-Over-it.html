<html lang="tr"><head><base target="_blank">


  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oyun Başlatıcı</title>
  <style>
    .fullscreen-button {
      display: inline-block;
      padding: 8px 20px;
      background-color: #000000;
      color: #ffffff !important;
      border: 2px solid #FFF;
      border-radius: 10px;
      font-family: Cursive, Cursive;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none !important;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1001;
    }
    
    .fullscreen-button:hover {
      background-color: #083B00 !important;
    }
    
    .content-container {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      border: none;
      overflow: hidden;
      z-index: 1000;
      background-color: #000;
    }
    
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
    }
  </style>
</head>
<body><a id="fullscreenButton" class="fullscreen-button">Load Game</a>
  <div id="contentContainer" class="content-container"></div>

  <script>
    const gameHTML = `


<html>
<head>
<meta charset="UTF-8">
<title>Climb Over It</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta name="generator" content="Construct 3">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/ClimbOverIt/ClimbOverIt.github.io@965fc18799266f1cb2ea3a6e0a0182d7fb72ada1/style.css" type="text/css">
</head>
<body>
<div id="fb-root"></div>
<script src="https://cdn.jsdelivr.net/gh/ClimbOverIt/ClimbOverIt.github.io@965fc18799266f1cb2ea3a6e0a0182d7fb72ada1/box2d.wasm.js"><\/script>
<noscript>
  <div id="notSupportedWrap">
   <h2 id="notSupportedTitle">This content requires JavaScript</h2>
   <p class="notSupportedMessage">JavaScript appears to be disabled. Please enable it to view this content.</p>
  </div>
 </noscript>
<script src="https://cdn.jsdelivr.net/gh/ClimbOverIt/ClimbOverIt.github.io@965fc18799266f1cb2ea3a6e0a0182d7fb72ada1/scripts/supportcheck.js"><\/script>
<script src="https://cdn.jsdelivr.net/gh/ClimbOverIt/ClimbOverIt.github.io@965fc18799266f1cb2ea3a6e0a0182d7fb72ada1/scripts/offlineclient.js" type="module"><\/script>
<script src="https://cdn.jsdelivr.net/gh/bobydob/godotpack@f5dc2eb5e1407c1c9ae1fefd02feeea6979897c5/side/coi/main.js" type="module"><\/script>
<script src="https://cdn.jsdelivr.net/gh/ClimbOverIt/ClimbOverIt.github.io@965fc18799266f1cb2ea3a6e0a0182d7fb72ada1/scripts/register-sw.js" type="module"><\/script>
</body>
</html>


    `.trim();

    // Butona olay dinleyicisi ekle
    document.addEventListener('DOMContentLoaded', function() {
      const playButton = document.getElementById('playButton');
      const fullscreenButton = document.getElementById('fullscreenButton');
      
      if (playButton) {
        playButton.addEventListener('click', showContent);
      } else {
        console.error('Play butonu bulunamadı.');
      }
      
      if (fullscreenButton) {
        fullscreenButton.addEventListener('click', openFullscreen);
      } else {
        console.error('Fullscreen butonu bulunamadı.');
      }
    });

    function showContent() {
      try {
        // Sadece play butonunu gizle
        document.getElementById('playButton').style.display = 'none';
        
        // İçerik konteynırını göster
        const container = document.getElementById('contentContainer');
        container.style.display = 'block';

        // Blob oluştur
        const blob = new Blob([gameHTML], { type: 'text/html' });
        const blobUrl = URL.createObjectURL(blob);

        // Mevcut iframe varsa temizle
        while (container.firstChild) {
          container.removeChild(container.firstChild);
        }

        // Yeni iframe oluştur
        const iframe = document.createElement('iframe');
        iframe.src = blobUrl;
        iframe.style.width = '100%';
        iframe.style.height = '100%';
        iframe.style.border = 'none';
        iframe.style.margin = '0';
        iframe.style.padding = '0';

        // Iframe'i ekle
        container.appendChild(iframe);

        // Hata ayıklama
        iframe.onload = () => console.log('Oyun yüklendi');
        iframe.onerror = (e) => console.error('Oyun yüklenirken hata:', e);
      } catch (error) {
        console.error('Hata oluştu:', error);
        alert('Oyun yüklenemedi. Tarayıcı konsolunu kontrol edin.');
      }
    }

    function openFullscreen() {
      try {
        // Yeni sekme aç
        const newWin = window.open("about:blank", "_blank");
        if (newWin) {
          newWin.document.open();
          newWin.document.write(gameHTML);
          newWin.document.close();

          // Tam ekran modunu ayarla (isteğe bağlı, tarayıcıya bağlı olarak çalışmayabilir)
          setTimeout(() => {
            if (newWin.document.documentElement.requestFullscreen) {
              newWin.document.documentElement.requestFullscreen();
            } else if (newWin.document.documentElement.mozRequestFullScreen) {
              newWin.document.documentElement.mozRequestFullScreen();
            } else if (newWin.document.documentElement.webkitRequestFullscreen) {
              newWin.document.documentElement.webkitRequestFullscreen();
            } else if (newWin.document.documentElement.msRequestFullscreen) {
              newWin.document.documentElement.msRequestFullscreen();
            }
          }, 500);
        } else {
          alert("Yeni sekme açma engellendi. Lütfen tarayıcı ayarlarını kontrol edin.");
        }
      } catch (error) {
        console.error('Fullscreen hata:', error);
        alert('Tam ekran modu çalışmadı. Tarayıcı konsolunu kontrol edin.');
      }
    }
  </script>

</body></html>
