    <script>
      setTimeout(function() {
        document.getElementById("thumbnail").remove();
      }, 2000)

      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen();
        } else {
          document.exitFullscreen();
        }
      }
      document.addEventListener("keydown", (e) => {
        if (e.key === "f" || e.key === "F") {

        } else if (e.ctrlKey) {
          e.preventDefault();
          e.stopPropagation();
        }
      });
