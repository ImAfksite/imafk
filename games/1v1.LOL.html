<html><head><base target="_blank"><script id="gamemonetize-sdk">Couldn't find the requested file /sedk.js in testamalame/sef.</script></head><body><div id="container">
  <iframe id="fr" width="100%" height="100%" frameborder="0" allowfullscreen=""></iframe>
  <button class="fullscreen-button" type="button" onclick="openFullscreen()">Load Game</button>
</div>

<style>
  .fullscreen-button { 
    padding: 8px 20px; 
    background: #000; 
    color: #fff; 
    border: 2px solid #FFF; 
    border-radius: 10px; 
    font: bold 24px cursive; 
    cursor: pointer; 
    position: absolute; 
    top: 50%; 
    left: 50%; 
    transform: translate(-50%, -50%); 
    z-index: 1001; 
  }
  .fullscreen-button:hover { background: #083B00; }
  
  body, html { margin: 0; padding: 0; overflow: hidden; height: 100%; }
</style>

<script>
  window.SDK_OPTIONS = {
    gameId: "9km7avlf26r9se5gam8028uq4p6drmx1",
    onEvent: function (a) {
      switch (a.name) {
        case "SDK_GAME_PAUSE":
          break;
        case "SDK_GAME_START":
          break;
        case "SDK_READY":
          break;
      }
    }
  };

  const DB_NAME = 'GameCacheDB';
  const STORE_NAME = 'GameFiles';
  const CACHE_DURATION = 90 * 24 * 60 * 60 * 1000;
  const FILE_URL = 'https://cdn.jsdelivr.net/gh/block-blast-fastx/8788@main/1v1.xml';
  const SDK_URL = 'https://cdn.jsdelivr.net/gh/testamalame/sef@main/sedk.js';

  function openDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, 1);
      request.onupgradeneeded = (event) => {
        const db = event.target.result;
        db.createObjectStore(STORE_NAME, { keyPath: 'url' });
      };
      request.onsuccess = (event) => resolve(event.target.result);
      request.onerror = (event) => reject(event.target.error);
    });
  }

  async function saveToCache(url, content) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const transaction = db.transaction(STORE_NAME, 'readwrite');
      const store = transaction.objectStore(STORE_NAME);
      const request = store.put({ url: url, content: content, timestamp: Date.now() });
      request.onsuccess = () => resolve();
      request.onerror = () => reject(new Error('Cache error'));
    });
  }

  async function getFileFromCache(url) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const transaction = db.transaction(STORE_NAME, 'readonly');
      const store = transaction.objectStore(STORE_NAME);
      const request = store.get(url);
      request.onsuccess = async (event) => {
        const data = event.target.result;
        if (data && (Date.now() - data.timestamp) < CACHE_DURATION) {
          resolve(data.content);
        } else {
          try {
            const response = await fetch(url);
            const text = await response.text();
            await saveToCache(url, text);
            resolve(text);
          } catch (err) {
            reject(err);
          }
        }
      };
      request.onerror = () => reject(new Error('DB error'));
    });
  }

  async function loadSDK() {
    try {
      const sdkContent = await getFileFromCache(SDK_URL);
      const script = document.createElement('script');
      script.text = sdkContent;
      script.id = 'gamemonetize-sdk';
      document.head.appendChild(script);
    } catch (err) {
      const script = document.createElement('script');
      script.id = 'gamemonetize-sdk';
      script.src = SDK_URL;
      document.head.appendChild(script);
    }
  }

  loadSDK();

  let isAdShown = false;
  function showAdOnClick() {
    if (!isAdShown && typeof sdk !== 'undefined' && typeof sdk.showBanner !== 'undefined') {
      sdk.showBanner();
      isAdShown = true;
    }
  }

  function openFullscreen() {
    getFileFromCache(FILE_URL).then((text) => {
      const newWindow = window.open("", "_blank");
      if (newWindow) {
        newWindow.document.open();
        newWindow.document.write(text);
        newWindow.document.close();

        newWindow.document.addEventListener('pointerdown', showAdOnClick);
        newWindow.document.addEventListener('touchstart', showAdOnClick);
      } else {
      }
    }).catch((err) => {
      console.error('Error:', err);
    });
  }
</script></body></html>
