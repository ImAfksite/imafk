<script>
    // --- SUPABASE CONFIGURATION ---
    const SUPABASE_URL = 'https://xtzbbqdlidefzsfiixwm.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh0emJicWRsaWRlZnpzZmlpeHdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczNjMzMjIsImV4cCI6MjEwMjkzOTMyMn0.jONPEEgyCYsv6lapUgVgeixHyWLYtfadveQZJUPm26Y';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('submissionForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerHTML = "<span>Publishing to Global Node... ⚡</span>";

        const newGame = {
            title: document.getElementById('game-name').value.trim(),
            author: document.getElementById('author').value.trim(),
            source_url: document.getElementById('source').value.trim(),
            html_code: document.getElementById('html-code').value,
            email: document.getElementById('email').value.trim(),
            status: 'live' // Automatically published
        };

        try {
            const { data, error } = await supabase
                .from('games')
                .insert([newGame]);

            if (error) throw error;

            localStorage.setItem('imAfk_SubmissionAgreed', 'true');
            alert('🎉 Game Published Successfully! It is now live on the Arcade Hub.');
            window.location.href = 'index.html';
        } catch (err) {
            console.error(err);
            alert('Error publishing game. Please check database keys.');
            submitBtn.disabled = false;
            submitBtn.innerHTML = "<span>🚀 Launch Project to Node</span>";
        }
    });
</script>
