<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="meta.title">Submit Your Project — I’m Afk</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-base: #f8f4ee;
            --bg-gradient: linear-gradient(120deg, #fbf8f3 0%, #f6ede3 45%, #f2dfcc 100%);
            --card-bg: rgba(255, 255, 255, 0.78);
            --card-border: rgba(255, 255, 255, 0.9);
            --card-shadow: 0 25px 60px -15px rgba(60, 42, 28, 0.08);
            --text-main: #211914;
            --text-muted: #736357;
            --warm-accent: #e29b64;
            --btn-dark-bg: linear-gradient(135deg, #211813 0%, #302019 55%, #3a281e 100%);
            --font-main: 'Plus Jakarta Sans', system-ui, sans-serif;
            --font-display: 'Space Grotesk', sans-serif;
            --font-code: 'JetBrains Mono', monospace;
        }

        html[lang="ar"] { --font-main: 'Tajawal', system-ui, sans-serif; }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-base);
            background-image: var(--bg-gradient);
            color: var(--text-main);
            font-family: var(--font-main);
            min-height: 100vh;
            line-height: 1.6;
        }

        .ambient-haze {
            position: fixed;
            top: -10%;
            right: -5%;
            width: 55vw;
            height: 55vw;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 236, 204, 0.5) 0%, rgba(255, 210, 165, 0.2) 50%, transparent 75%);
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
        }

        .glass-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px clamp(24px, 4vw, 50px);
            background: rgba(251, 248, 243, 0.75);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(106, 72, 49, 0.08);
        }

        .brand-block {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-main);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
        }

        .nav-back-btn, .lang-toggle {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(106, 72, 49, 0.12);
            color: var(--text-main);
            padding: 7px 18px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 10px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .nav-back-btn:hover, .lang-toggle:hover {
            background: #ffffff;
            border-color: rgba(106, 72, 49, 0.25);
            transform: translateY(-1px);
        }

        .submit-container {
            max-width: 860px;
            margin: 50px auto 80px;
            padding: 0 24px;
            position: relative;
            z-index: 1;
        }

        .submit-header {
            text-align: center;
            margin-bottom: 36px;
        }

        .submit-header h1 {
            font-family: var(--font-display);
            font-size: clamp(2.2rem, 4vw, 3rem);
            font-weight: 600;
            letter-spacing: -0.03em;
            margin-bottom: 8px;
        }

        .submit-header p {
            color: var(--text-muted);
            font-size: 1rem;
            max-width: 520px;
            margin: 0 auto;
        }

        .glass-form-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 32px;
            padding: 44px;
            backdrop-filter: blur(25px);
            box-shadow: var(--card-shadow);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }
        .full-width { grid-column: 1 / -1; }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .input-group input {
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(106, 72, 49, 0.15);
            padding: 14px 18px;
            border-radius: 14px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
        }

        .input-group input:focus {
            background: #ffffff;
            border-color: rgba(106, 72, 49, 0.4);
            box-shadow: 0 8px 25px rgba(60, 42, 28, 0.06);
        }

        .drop-zone {
            border: 2px dashed rgba(106, 72, 49, 0.25);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            background: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 12px;
        }

        .drop-zone:hover {
            border-color: var(--warm-accent);
            background: rgba(255, 255, 255, 0.7);
        }

        .drop-zone p { color: var(--text-muted); font-size: 0.88rem; }
        .drop-zone span { color: var(--text-main); font-weight: 700; }

        .code-area {
            width: 100%;
            height: 200px;
            background: #1e1915;
            border: 1px solid rgba(106, 72, 49, 0.2);
            border-radius: 16px;
            padding: 16px;
            color: #ffe6cf;
            font-family: var(--font-code);
            font-size: 0.85rem;
            line-height: 1.5;
            resize: vertical;
            outline: none;
        }

        .code-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .test-btn {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(106, 72, 49, 0.15);
            color: var(--text-main);
            padding: 6px 16px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .test-btn:hover { background: #ffffff; transform: translateY(-1px); }

        .submit-btn-main {
            width: 100%;
            background: var(--btn-dark-bg);
            color: #fffaf4;
            padding: 16px;
            border: none;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(48, 32, 25, 0.15);
            transition: all 0.25s ease;
            margin-top: 10px;
        }

        .submit-btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(48, 32, 25, 0.25);
        }

        /* Sandbox Modal */
        .sandbox-modal {
            position: fixed;
            inset: 0;
            background: rgba(23, 18, 14, 0.8);
            backdrop-filter: blur(15px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .sandbox-window {
            width: 100%;
            max-width: 960px;
            height: 80vh;
            background: #1e1915;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sandbox-header {
            padding: 14px 20px;
            background: #28211c;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            font-size: 0.9rem;
        }

        .sandbox-close-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        #sandbox-frame { flex: 1; border: none; background: #000; }

        footer {
            border-top: 1px solid rgba(106, 72, 49, 0.1);
            padding: 40px 24px;
            text-align: center;
            background: rgba(248, 244, 238, 0.8);
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="ambient-haze"></div>

    <header class="glass-nav">
        <a href="index.html" class="brand-block" id="brand-logo">
            <span>✦</span>
            <span>I’M AFK</span>
        </a>
        <div style="display: flex; gap: 12px;">
            <a href="index.html" class="nav-back-btn" data-i18n="nav.back">← Return to Hub</a>
            <button type="button" class="lang-toggle" id="lang-btn">العربية</button>
        </div>
    </header>

    <main class="submit-container">
        <div class="submit-header">
            <h1 data-i18n="sub.title">Submit Your <span>Game</span></h1>
            <p data-i18n="sub.lead">Add your standalone HTML5 creation to the curated network index.</p>
        </div>

        <div class="glass-form-card">
            <form id="submissionForm">
                <div class="form-grid">
                    <div class="input-group">
                        <label for="game-name" data-i18n="form.name">Project Title *</label>
                        <input type="text" id="game-name" placeholder="e.g. Celestial Orbit" required>
                    </div>

                    <div class="input-group">
                        <label for="author" data-i18n="form.author">Author / Studio Credits *</label>
                        <input type="text" id="author" placeholder="e.g. Elena Vance / @handle" required>
                    </div>

                    <div class="input-group full-width">
                        <label for="source" data-i18n="form.source">Repository / Source URL (Optional)</label>
                        <input type="url" id="source" placeholder="https://github.com/user/project">
                    </div>

                    <div class="input-group full-width">
                        <label data-i18n="form.code">Standalone HTML5 Code *</label>
                        <div class="drop-zone" id="dropZone">
                            <p><span data-i18n="form.dropPrompt">Drop .html file here</span> or paste raw code below</p>
                            <input type="file" id="fileInput" accept=".html,.htm" style="display:none;">
                        </div>
                        <textarea id="html-code" class="code-area" placeholder="<!DOCTYPE html>&#10;<html>...</html>" required></textarea>
                        <div class="code-toolbar">
                            <span id="code-stats">0 characters | 0 lines</span>
                            <button type="button" class="test-btn" id="run-sandbox-btn" data-i18n="form.test">⚡ Run Sandbox Preview</button>
                        </div>
                    </div>

                    <div class="input-group full-width">
                        <label for="email" data-i18n="form.email">Contact Email *</label>
                        <input type="email" id="email" placeholder="dev@domain.com" required>
                    </div>
                </div>

                <div style="margin-bottom: 20px; display: flex; align-items: center; gap: 8px;">
                    <input type="checkbox" id="agree" required style="accent-color: var(--warm-accent);">
                    <label for="agree" style="font-size: 0.85rem; color: var(--text-muted);" data-i18n="form.agree">
                        I confirm this code is authored by me or licensed under permissive open-source terms.
                    </label>
                </div>

                <button type="submit" class="submit-btn-main" id="submitBtn">
                    <span data-i18n="form.submit">Publish Project to Index →</span>
                </button>
            </form>
        </div>
    </main>

    <!-- Sandbox Modal -->
    <div class="sandbox-modal" id="sandbox-modal">
        <div class="sandbox-window">
            <div class="sandbox-header">
                <span>▶ Live Sandbox Environment</span>
                <button type="button" class="sandbox-close-btn" id="close-sandbox-btn">✕ Close</button>
            </div>
            <iframe id="sandbox-frame" sandbox="allow-scripts allow-forms allow-pointer-lock" allow="fullscreen; autoplay; gamepad"></iframe>
        </div>
    </div>

    <footer>
        <p>&copy; 2024–2026 I’m Afk &bull; Submission Studio</p>
    </footer>

    <script>
        const I18N = {
            en: {
                "meta.title": "Submit Your Project — I’m Afk",
                "nav.back": "← Return to Hub",
                "sub.title": "Submit Your <span>Game</span>",
                "sub.lead": "Add your standalone HTML5 creation to the curated network index.",
                "form.name": "Project Title *",
                "form.author": "Author / Studio Credits *",
                "form.source": "Repository / Source URL (Optional)",
                "form.code": "Standalone HTML5 Code *",
                "form.dropPrompt": "Drop .html file here",
                "form.test": "⚡ Run Sandbox Preview",
                "form.email": "Contact Email *",
                "form.agree": "I confirm this code is authored by me or licensed under permissive open-source terms.",
                "form.submit": "Publish Project to Index →"
            },
            ar: {
                "meta.title": "أضف مشروعك ولعبتك — I’m Afk",
                "nav.back": "← العودة إلى الرئيسية",
                "sub.title": "أضف <span>لعبتك الخاصة</span>",
                "sub.lead": "شارك لعبتك المبنية بـ HTML5 ليتم عرضها ونشرها في المنصة مباشرة.",
                "form.name": "اسم اللعبة أو المشروع *",
                "form.author": "اسم المطور أو الأستوديو *",
                "form.source": "رابط الكود أو المستودع (اختياري)",
                "form.code": "كود الـ HTML5 الكامل *",
                "form.dropPrompt": "اسحب ملف .html هنا",
                "form.test": "⚡ تجربة وتشغيل في الصندوق التجريبي",
                "form.email": "البريد الإلكتروني للتواصل *",
                "form.agree": "أقر بأن هذا الكود من برمجتي أو مرخص برخصة برمجية مفتوحة المصدر.",
                "form.submit": "نشر اللعبة في المنصة ←"
            }
        };

        let currentLang = 'en';
        const langBtn = document.getElementById('lang-btn');

        function setLanguage(lang) {
            currentLang = lang;
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            langBtn.textContent = lang === 'en' ? 'العربية' : 'English';
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (I18N[lang][key]) el.innerHTML = I18N[lang][key];
            });
        }
        langBtn.addEventListener('click', () => setLanguage(currentLang === 'en' ? 'ar' : 'en'));

        const SUPABASE_URL = 'https://xtzbbqdlidefzsfiixwm.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh0emJicWRsaWRlZnpzZmlpeHdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczNjMzMjIsImV4cCI6MjEwMjkzOTMyMn0.jONPEEgyCYsv6lapUgVgeixHyWLYtfadveQZJUPm26Y';
        const sbClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        document.getElementById('submissionForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "Publishing to Network... ⚡";

            const newGame = {
                title: document.getElementById('game-name').value.trim(),
                author: document.getElementById('author').value.trim(),
                source_url: document.getElementById('source').value.trim() || null,
                html_code: document.getElementById('html-code').value,
                email: document.getElementById('email').value.trim(),
                status: 'live'
            };

            try {
                if (!sbClient) throw new Error("Supabase is not configured.");
                const { error } = await sbClient.from('games').insert([newGame]);
                if (error) throw error;
                alert("🎉 Project published successfully! It is now live on the index.");
                window.location.href = "index.html";
            } catch (err) {
                alert("Error: " + (err.message || "Failed to publish"));
                submitBtn.disabled = false;
                submitBtn.innerText = "Publish Project to Index →";
            }
        });

        // Code Area & Drag/Drop
        const codeInput = document.getElementById('html-code');
        const statsDisplay = document.getElementById('code-stats');
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');

        function updateCodeStats() {
            const code = codeInput.value;
            const lines = code ? code.split('\n').length : 0;
            statsDisplay.textContent = `${code.length.toLocaleString()} chars | ${lines} lines`;
        }
        codeInput.addEventListener('input', updateCodeStats);
        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => { if (e.target.files.length) readFile(e.target.files[0]); });

        function readFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                codeInput.value = e.target.result;
                updateCodeStats();
                const nameInput = document.getElementById('game-name');
                if (!nameInput.value) nameInput.value = file.name.replace(/\.[^/.]+$/, "").replace(/[-_]/g, ' ');
            };
            reader.readAsText(file);
        }

        // Sandbox Modal
        const sandboxModal = document.getElementById('sandbox-modal');
        const sandboxFrame = document.getElementById('sandbox-frame');
        document.getElementById('run-sandbox-btn').addEventListener('click', () => {
            const code = codeInput.value.trim();
            if (!code) return alert("Please enter HTML code first.");
            const blob = new Blob([code], { type: 'text/html' });
            sandboxFrame.src = URL.createObjectURL(blob);
            sandboxModal.style.display = 'flex';
        });
        document.getElementById('close-sandbox-btn').addEventListener('click', () => {
            sandboxModal.style.display = 'none';
            sandboxFrame.src = 'about:blank';
        });
    </script>
</body>
</html>
