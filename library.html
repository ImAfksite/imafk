<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library — I’M AFK</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-display: 'Space Grotesk', -apple-system, sans-serif;
            
            --nav-height: 56px;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-pill: 9999px;
            --transition: 0.2s ease;
        }

        /* DARK THEME */
        [data-theme="dark"] {
            --bg-canvas: #121615;
            --bg-surface: rgba(22, 28, 27, 0.85);
            --bg-card: rgba(28, 36, 34, 0.9);
            --bg-input: #18201E;
            --bg-hover: rgba(255, 255, 255, 0.05);

            --border: rgba(255, 255, 255, 0.09);
            --border-strong: rgba(255, 255, 255, 0.18);

            --text-main: #EDF3F1;
            --text-secondary: #9EB3AD;
            --text-muted: #6B807A;

            --brand: #5B9287;
            --brand-hover: #487A70;
            --brand-soft: rgba(91, 146, 135, 0.18);
        }

        /* LIGHT THEME */
        [data-theme="light"] {
            --bg-canvas: #F7F9F8;
            --bg-surface: rgba(255, 255, 255, 0.85);
            --bg-card: #FFFFFF;
            --bg-input: #FFFFFF;
            --bg-hover: rgba(0, 0, 0, 0.04);

            --border: rgba(0, 0, 0, 0.08);
            --border-strong: rgba(0, 0, 0, 0.16);

            --text-main: #20332F;
            --text-secondary: #536B66;
            --text-muted: #859E98;

            --brand: #43766C;
            --brand-hover: #355E56;
            --brand-soft: #DDEBE6;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-canvas);
            color: var(--text-main);
            font-family: var(--font-ui);
            font-size: 14px;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .content-width {
            max-width: 1040px;
            width: 100%;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Navigation */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            height: var(--nav-height);
            background: var(--bg-surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 clamp(16px, 4vw, 36px);
        }

        .brand-link {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 700;
            font-family: var(--font-display);
            font-size: 1rem;
        }

        .brand-badge {
            width: 24px;
            height: 24px;
            background: var(--brand);
            color: #FFFFFF;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 22px;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: var(--transition);
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--text-main);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 7px 14px;
            border-radius: var(--radius-sm);
            font-family: var(--font-ui);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
        }

        .btn:hover {
            border-color: var(--border-strong);
            background: var(--bg-hover);
        }

        .btn-primary {
            background: var(--brand);
            border-color: var(--brand);
            color: #FFFFFF;
        }

        .btn-primary:hover {
            background: var(--brand-hover);
            color: #FFFFFF;
        }

        /* Hero */
        .hero {
            padding: 40px 0 20px 0;
            text-align: center;
        }

        .hero h1 {
            font-family: var(--font-display);
            font-size: clamp(1.8rem, 3.5vw, 2.6rem);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .hero p {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        /* Subtle Live Activity Bar */
        .status-strip {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: var(--brand-soft);
            color: var(--brand);
            padding: 5px 16px;
            border-radius: var(--radius-pill);
            font-size: 12px;
            font-weight: 600;
            margin-top: 14px;
        }

        .pulse-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--brand);
            display: inline-block;
        }

        /* Search & Filter Controls */
        .controls-wrap {
            margin: 28px 0 24px 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .search-row {
            display: flex;
            gap: 10px;
        }

        .search-input {
            flex: 1;
            padding: 12px 18px;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-pill);
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: var(--transition);
        }

        .search-input:focus {
            border-color: var(--brand);
        }

        .select-input {
            padding: 0 16px;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-pill);
            color: var(--text-main);
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }

        .filter-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-tag {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: var(--radius-pill);
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
        }

        .filter-tag:hover {
            color: var(--text-main);
            border-color: var(--border-strong);
        }

        .filter-tag.active {
            background: var(--brand);
            color: #FFFFFF;
            border-color: var(--brand);
        }

        /* Game Catalog Grid */
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
            margin-bottom: 60px;
        }

        .catalog-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 150px;
            cursor: pointer;
            transition: var(--transition);
        }

        .catalog-card:hover {
            transform: translateY(-2px);
            border-color: var(--brand);
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }

        .card-title {
            font-family: var(--font-display);
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .card-author {
            font-size: 12px;
            color: var(--text-muted);
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 16px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
            font-size: 12px;
        }

        .card-plays {
            color: var(--text-muted);
        }

        .play-btn {
            color: var(--brand);
            font-weight: 600;
        }

        /* Dedicated Fullscreen Game Overlay */
        #player-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: #000000;
            z-index: 1000;
            flex-direction: column;
        }

        #player-overlay.active {
            display: flex;
        }

        .player-bar {
            height: 48px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
        }

        .player-title {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .player-actions {
            display: flex;
            gap: 8px;
        }

        #game-frame {
            flex: 1;
            width: 100%;
            border: none;
            background: #FFFFFF;
        }

        /* Footer */
        footer {
            border-top: 1px solid var(--border);
            padding: 24px clamp(16px, 4vw, 36px);
            background: var(--bg-surface);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: auto;
        }

        @media (max-width: 768px) {
            .nav-links { display: none; }
            .search-row { flex-direction: column; }
            .select-input { padding: 10px 16px; }
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header class="navbar">
        <a href="index.html" class="brand-link" title="I’M AFK Hub">
            <div class="brand-badge">✦</div>
            <span>I’M AFK</span>
        </a>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="library.html" class="active">Library</a></li>
            <li><a href="studio.html">Studio</a></li>
            <li><a href="submit.html">Submit</a></li>
            <li><a href="contact.html">Support</a></li>
        </ul>

        <div class="nav-actions">
            <a href="studio.html" class="btn btn-primary">+ Create Project</a>
            <button type="button" class="btn" onclick="toggleTheme()" title="Switch Theme">◐</button>
        </div>
    </header>

    <div class="content-width">
        <section class="hero">
            <h1>Game Library</h1>
            <p>Run standalone web games and tools directly in your browser.</p>
            <div class="status-strip">
                <span class="pulse-dot"></span>
                <span><span id="live-players-count">1</span> Online</span>
                <span>•</span>
                <span><span id="total-plays-count">0</span> Plays</span>
            </div>
        </section>

        <!-- Search & Category Filters -->
        <section class="controls-wrap">
            <div class="search-row">
                <input type="text" id="game-search" class="search-input" placeholder="Search by title or author..." oninput="filterAndSortGames()">
                <select id="sort-select" class="select-input" onchange="filterAndSortGames()">
                    <option value="popular">Most Played</option>
                    <option value="alpha">Title (A-Z)</option>
                </select>
            </div>

            <div class="filter-tags">
                <button class="filter-tag active" onclick="setCategoryFilter('all', this)">All</button>
                <button class="filter-tag" onclick="setCategoryFilter('popular', this)">Most Played</button>
                <button class="filter-tag" onclick="setCategoryFilter('arcade', this)">Arcade</button>
                <button class="filter-tag" onclick="setCategoryFilter('classic', this)">Classic</button>
                <button class="filter-tag" onclick="setCategoryFilter('community', this)">Community</button>
            </div>
        </section>

        <!-- Catalog Grid -->
        <main class="catalog-grid" id="game-container">
            <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted);">
                Loading library...
            </div>
        </main>
    </div>

    <!-- Footer -->
    <footer>
        <span>&copy; 2026 I’M AFK</span>
        <span>Curated Web Projects</span>
    </footer>

    <!-- Fullscreen Player Overlay -->
    <div id="player-overlay">
        <div class="player-bar">
            <div class="player-title">
                <button class="btn" id="player-back-btn">← Back</button>
                <span id="player-game-title">Game Title</span>
            </div>
            <div class="player-actions">
                <button class="btn" id="player-edit-btn">Open in Studio</button>
                <button class="btn" id="player-reload-btn">Reload</button>
                <button class="btn" id="player-tab-btn">New Tab</button>
                <button class="btn" id="player-fullscreen-btn">Fullscreen</button>
            </div>
        </div>
        <iframe id="game-frame" sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-forms allow-modals allow-popups" allow="fullscreen; autoplay; gamepad"></iframe>
    </div>

    <script>
        /* Theme Toggle */
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') || 'dark';
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('afk_theme', next);
        }

        const savedTheme = localStorage.getItem('afk_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);

        /* Supabase & GitHub Configuration */
        const SUPABASE_URL = 'https://xtzbbqdlidefzsfiixwm.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh0emJicWRsaWRlZnpzZmlpeHdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczNjMzMjIsImV4cCI6MjEwMjkzOTMyMn0.jONPEEgyCYsv6lapUgVgeixHyWLYtfadveQZJUPm26Y';
        const sbClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
        
        const GITHUB_USER = 'imafksite';
        const GITHUB_REPO = 'imafk';

        let catalog = [];
        let activeCategory = 'all';

        /* Presence Tracker */
        function initPresenceTracker() {
            if (!sbClient) return;
            const channel = sbClient.channel('imafk-live-presence', {
                config: { presence: { key: 'user_' + Math.random().toString(36).substring(2, 9) } }
            });

            channel.on('presence', { event: 'sync' }, () => {
                const state = channel.presenceState();
                const totalOnline = Object.keys(state).reduce((acc, key) => acc + state[key].length, 0);
                document.getElementById('live-players-count').textContent = Math.max(1, totalOnline).toLocaleString();
            });

            channel.subscribe(async (status) => {
                if (status === 'SUBSCRIBED') {
                    await channel.track({ online_at: new Date().toISOString() });
                }
            });
        }

        /* Built-in Fallbacks */
        const BUILTINS = [
            {
                id: 'snake_core',
                title: 'Retro Snake',
                author: 'AFK Core',
                category: 'classic',
                play_count: 0,
                html_code: `<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;background:#121615;color:#EDF3F1;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;}canvas{background:#18201E;border-radius:10px;}</style></head><body><canvas id="c" width="400" height="400"></canvas><p style="color:#6B807A;font-size:12px;margin-top:10px;">Use arrow keys to move</p><script>const c=document.getElementById("c"),ctx=c.getContext("2d");let snake=[{x:10,y:10}],dir={x:1,y:0},food={x:15,y:15},score=0;setInterval(()=>{let head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(head.x<0||head.x>=20||head.y<0||head.y>=20||snake.some(p=>p.x===head.x&&p.y===head.y)){snake=[{x:10,y:10}];dir={x:1,y:0};score=0;return;}snake.unshift(head);if(head.x===food.x&&head.y===food.y){score+=10;food={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)};}else snake.pop();ctx.fillStyle="#18201E";ctx.fillRect(0,0,400,400);ctx.fillStyle="#ef4444";ctx.fillRect(food.x*20,food.y*20,18,18);ctx.fillStyle="#5B9287";snake.forEach(p=>ctx.fillRect(p.x*20,p.y*20,18,18));ctx.fillStyle="#fff";ctx.font="12px monospace";ctx.fillText("SCORE: "+score,10,20);},100);window.onkeydown=e=>{if(e.key==="ArrowUp"&&dir.y===0)dir={x:0,y:-1};if(e.key==="ArrowDown"&&dir.y===0)dir={x:0,y:1};if(e.key==="ArrowLeft"&&dir.x===0)dir={x:-1,y:0};if(e.key==="ArrowRight"&&dir.x===0)dir={x:1,y:0};};<\/script></body></html>`
            },
            {
                id: 'pong_core',
                title: 'Minimalist Pong',
                author: 'AFK Core',
                category: 'arcade',
                play_count: 0,
                html_code: `<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;background:#121615;color:#EDF3F1;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;}canvas{background:#18201E;border-radius:10px;}</style></head><body><canvas id="c" width="480" height="320"></canvas><p style="color:#6B807A;font-size:12px;margin-top:8px;">Move mouse vertically</p><script>const c=document.getElementById("c"),ctx=c.getContext("2d");let p1=120,p2=120,bx=240,by=160,vx=4,vy=3,s1=0,s2=0;c.onmousemove=e=>{p1=e.clientY-c.getBoundingClientRect().top-35;};setInterval(()=>{bx+=vx;by+=vy;if(by<5||by>315)vy*=-1;if(bx<20&&by>p1&&by<p1+70)vx=Math.abs(vx)*1.05;if(bx>460&&by>p2&&by<p2+70)vx=-Math.abs(vx)*1.05;p2+=(by-(p2+35))*0.1;if(bx<0){s2++;reset();}if(bx>480){s1++;reset();}function reset(){bx=240;by=160;vx=(Math.random()>0.5?4:-4);vy=(Math.random()-0.5)*6;}ctx.fillStyle="#18201E";ctx.fillRect(0,0,480,320);ctx.fillStyle="#5B9287";ctx.fillRect(10,p1,8,70);ctx.fillStyle="#ef4444";ctx.fillRect(462,p2,8,70);ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(bx,by,6,0,Math.PI*2);ctx.fill();ctx.fillText(s1+"   "+s2,230,25);},1000/60);<\/script></body></html>`
            }
        ];

        /* Load Library */
        async function initLibrary() {
            catalog = [];

            if (sbClient) {
                try {
                    const { data, error } = await sbClient.from('games').select('*').order('created_at', { ascending: false });
                    if (!error && Array.isArray(data)) {
                        data.filter(g => g.status === 'live').forEach(g => {
                            const localPlays = parseInt(localStorage.getItem('afk_plays_' + g.id)) || 0;
                            catalog.push({
                                id: g.id,
                                title: g.title,
                                author: g.author || 'Community',
                                category: 'community',
                                play_count: Math.max(g.play_count || 0, localPlays),
                                html_code: g.html_code,
                                type: 'supabase'
                            });
                        });
                    }
                } catch (e) {
                    console.warn("Supabase notice:", e);
                }
            }

            try {
                const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/games`);
                const files = await res.json();
                if (Array.isArray(files)) {
                    files.filter(f => f.name.endsWith('.html')).forEach(f => {
                        const localPlays = parseInt(localStorage.getItem('afk_plays_' + f.name)) || 0;
                        catalog.push({
                            id: f.name,
                            title: f.name.replace('.html', '').replace(/[-_]/g, ' ').replace(/\b\w/g, l => l.toUpperCase()),
                            author: 'GitHub',
                            category: 'arcade',
                            play_count: localPlays,
                            url: `https://${GITHUB_USER}.github.io/${GITHUB_REPO}/games/${f.name}`,
                            type: 'github'
                        });
                    });
                }
            } catch (e) {
                console.warn("GitHub notice:", e);
            }

            if (catalog.length === 0) {
                BUILTINS.forEach(b => {
                    const localPlays = parseInt(localStorage.getItem('afk_plays_' + b.id)) || 0;
                    catalog.push({ ...b, play_count: localPlays });
                });
            }

            updatePlaysCounter();
            filterAndSortGames();
            initPresenceTracker();

            const params = new URLSearchParams(window.location.search);
            const playParam = params.get('play');
            if (playParam) {
                const target = catalog.find(g => g.title.toLowerCase() === playParam.toLowerCase());
                if (target) launchGame(target);
            }
        }

        function updatePlaysCounter() {
            const total = catalog.reduce((sum, g) => sum + (g.play_count || 0), 0);
            document.getElementById('total-plays-count').textContent = total.toLocaleString();
        }

        function recordPlay(game) {
            game.play_count = (game.play_count || 0) + 1;
            localStorage.setItem('afk_plays_' + (game.id || game.title), game.play_count);
            updatePlaysCounter();
            filterAndSortGames();

            if (sbClient && game.id && game.type === 'supabase') {
                sbClient.from('games').update({ play_count: game.play_count }).eq('id', game.id).catch(() => {});
            }
        }

        function setCategoryFilter(cat, btn) {
            activeCategory = cat;
            document.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            filterAndSortGames();
        }

        function filterAndSortGames() {
            const container = document.getElementById('game-container');
            const search = document.getElementById('game-search').value.toLowerCase().trim();
            const sort = document.getElementById('sort-select').value;

            let list = [...catalog];

            if (activeCategory === 'popular') {
                list.sort((a, b) => (b.play_count || 0) - (a.play_count || 0));
            } else if (activeCategory !== 'all') {
                list = list.filter(g => g.category === activeCategory);
            }

            if (search) {
                list = list.filter(g => g.title.toLowerCase().includes(search) || g.author.toLowerCase().includes(search));
            }

            if (sort === 'popular') {
                list.sort((a, b) => (b.play_count || 0) - (a.play_count || 0));
            } else if (sort === 'alpha') {
                list.sort((a, b) => a.title.localeCompare(b.title));
            }

            if (list.length === 0) {
                container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted);">No games found matching your search.</div>`;
                return;
            }

            container.innerHTML = '';
            list.forEach(game => {
                const card = document.createElement('div');
                card.className = 'catalog-card';
                card.innerHTML = `
                    <div>
                        <h3 class="card-title">${game.title}</h3>
                        <div class="card-author">${game.author}</div>
                    </div>
                    <div class="card-footer">
                        <span class="card-plays">${(game.play_count || 0).toLocaleString()} plays</span>
                        <span class="play-btn">Play ➔</span>
                    </div>
                `;
                card.onclick = () => launchGame(game);
                container.appendChild(card);
            });
        }

        /* Player Controller */
        const playerOverlay = document.getElementById('player-overlay');
        const gameFrame = document.getElementById('game-frame');
        const playerGameTitle = document.getElementById('player-game-title');
        let currentActiveGame = null;

        function launchGame(game) {
            currentActiveGame = game;
            recordPlay(game);
            playerGameTitle.textContent = game.title;
            playerOverlay.classList.add('active');

            gameFrame.src = 'about:blank';
            setTimeout(() => {
                if (game.html_code) {
                    gameFrame.removeAttribute('src');
                    gameFrame.srcdoc = game.html_code;
                } else if (game.url) {
                    gameFrame.removeAttribute('srcdoc');
                    gameFrame.src = game.url;
                }
                setTimeout(() => gameFrame.focus(), 100);
            }, 50);
        }

        function closeGame() {
            playerOverlay.classList.remove('active');
            gameFrame.srcdoc = '';
            gameFrame.src = 'about:blank';
        }

        document.getElementById('player-back-btn').onclick = closeGame;

        document.getElementById('player-reload-btn').onclick = () => {
            if (!currentActiveGame) return;
            gameFrame.srcdoc = '';
            gameFrame.src = 'about:blank';
            setTimeout(() => {
                if (currentActiveGame.html_code) gameFrame.srcdoc = currentActiveGame.html_code;
                else if (currentActiveGame.url) gameFrame.src = currentActiveGame.url;
            }, 60);
        };

        document.getElementById('player-tab-btn').onclick = () => {
            if (!currentActiveGame) return;
            if (currentActiveGame.html_code) {
                const w = window.open('', '_blank');
                if (w) { w.document.write(currentActiveGame.html_code); w.document.close(); }
            } else if (currentActiveGame.url) {
                window.open(currentActiveGame.url, '_blank');
            }
        };

        document.getElementById('player-fullscreen-btn').onclick = () => {
            if (gameFrame.requestFullscreen) gameFrame.requestFullscreen();
            else if (gameFrame.webkitRequestFullscreen) gameFrame.webkitRequestFullscreen();
        };

        document.getElementById('player-edit-btn').onclick = () => {
            if (!currentActiveGame || !currentActiveGame.html_code) {
                window.location.href = 'studio.html';
                return;
            }

            const manifest = JSON.parse(localStorage.getItem('afk_studio_projects_v3') || '[]');
            const newProj = {
                id: 'proj_' + Date.now(),
                title: currentActiveGame.title,
                files: [
                    { name: "index.html", path: "index.html", type: "html", content: currentActiveGame.html_code }
                ],
                updatedAt: Date.now(),
                snapshots: []
            };

            manifest.unshift(newProj);
            localStorage.setItem('afk_studio_projects_v3', JSON.stringify(manifest));
            localStorage.setItem('afk_studio_active_id_v3', newProj.id);
            window.location.href = 'studio.html';
        };

        initLibrary();
    </script>
</body>
</html>
